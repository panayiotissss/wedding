<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andreas &amp; Charis Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose: #c9a9a6;
      --rose-dark: #b89490;
      --ink: #4a4442;
      /* An elegant serif for names/headings; falls back to Georgia if the
         web font is slow or blocked, so the page always looks intentional. */
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      background: linear-gradient(160deg, #faf8f5 0%, #f4ece6 100%);
      background-attachment: fixed;
      color: #333;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid #ede8e1;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .brand {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .login-link {
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid #c9a9a6;
      border-radius: 20px;
      color: #c9a9a6;
      text-decoration: none;
      transition: background 0.15s;
    }
    .login-link:hover { background: #fdf0ef; }

    /* ── Main card ── */
    main {
      max-width: 440px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem 1.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card h1 {
      font-family: var(--serif);
      font-size: 2.1rem;
      font-weight: 600;
      text-align: center;
      color: var(--ink);
      margin-bottom: 0.15rem;
    }
    .subtitle {
      text-align: center;
      color: #a79b94;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    /* Small decorative divider between the title block and the form */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: var(--rose);
      margin-bottom: 1.75rem;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 44px;
      background: linear-gradient(to var(--dir, right), transparent, #e3d3ce);
    }
    .divider::before { --dir: left; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 0.35rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.25rem;
      background: #fdfcfb;
    }
    input[type="text"]:focus { border-color: #c9a9a6; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 1rem;
    }
    .drop-zone.over, .drop-zone:hover {
      border-color: #c9a9a6;
      background: #fef8f7;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0; /* hides iOS tooltip */
    }
    .drop-zone .dz-icon { font-size: 2.25rem; margin-bottom: 0.5rem; }
    .drop-zone .dz-primary { font-weight: 500; color: #555; font-size: 0.95rem; }
    .drop-zone .dz-secondary { color: #aaa; font-size: 0.78rem; margin-top: 0.25rem; }

    /* ── Preview grid ── */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 1rem;
    }
    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #f0ede9;
    }
    .preview-item img,
    .preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .preview-badge {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 3px 5px;
      font-size: 0.62rem;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.2s;
    }
    .badge-pending  { background: rgba(0,0,0,0.4);   color: #fff; }
    .badge-uploading{ background: rgba(201,169,166,0.9); color: #fff; }
    .badge-done     { background: rgba(76,175,80,0.85);  color: #fff; }
    .badge-error    { background: rgba(211,47,47,0.85);  color: #fff; }

    /* Per-item progress fill — a thin bar along the bottom of each thumbnail
       that grows left→right as that file uploads. */
    .preview-progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #7fbf82;
      transition: width 0.15s ease-out;
    }

    /* ── Overall progress bar (all files combined) ── */
    .overall-progress {
      display: none;
      margin-bottom: 1rem;
    }
    .overall-progress .op-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 0.35rem;
    }
    .overall-progress .op-track {
      height: 8px;
      background: #ede8e1;
      border-radius: 6px;
      overflow: hidden;
    }
    .overall-progress .op-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c9a9a6, #b89490);
      border-radius: 6px;
      transition: width 0.2s ease-out;
    }

    /* ── Upload button ── */
    .btn-upload {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: #c9a9a6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-upload:hover:not(:disabled) { background: #b89490; }
    .btn-upload:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Toast message ── */
    .toast {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
    .toast.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .toast.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .toast.info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>

<header>
  <span class="brand">Andreas &amp; Charis</span>
  <a href="/gallery" class="login-link">Couple login</a>
</header>

<main>
  <div class="card">
    <h1>Share your photos</h1>
    <p class="subtitle">Help us capture every moment of our special day</p>
    <div class="divider">&#10084;</div>

    <label for="guestName">Your name</label>
    <input type="text" id="guestName" placeholder="e.g. Maria Georgiou"
           autocomplete="name" autocorrect="off" spellcheck="false" />

    <label>Photos &amp; videos</label>
    <div class="drop-zone" id="dropZone">
      <!--
        No `capture` attribute — that forces camera-only on some phones.
        Without it, iOS/Android shows "Take Photo", "Photo Library", etc.
        accept="image/*,video/*" still restricts the picker to media.
      -->
      <input type="file" id="fileInput" multiple accept="image/*,video/*" />
      <div class="dz-icon">&#128247;</div>
      <p class="dz-primary">Tap to choose or drag &amp; drop</p>
      <p class="dz-secondary">Photos &amp; videos · up to 500 MB each</p>
    </div>

    <div class="preview-grid" id="previewGrid" style="display:none"></div>

    <div class="overall-progress" id="overallProgress">
      <div class="op-label">
        <span id="opText">Uploading…</span>
        <span id="opPercent">0%</span>
      </div>
      <div class="op-track"><div class="op-fill" id="opFill"></div></div>
    </div>

    <button class="btn-upload" id="uploadBtn" disabled>Choose photos first</button>

    <div class="toast" id="toast"></div>
  </div>
</main>

<script>
  "use strict";

  const MAX_SIZE = 500 * 1024 * 1024;
  const MAX_PARALLEL = 3;  // how many files upload at once
  const ALLOWED = new Set([
    "image/jpeg","image/png","image/gif","image/webp",
    "image/heic","image/heif",
    "video/mp4","video/quicktime","video/x-msvideo",
  ]);

  const nameInput   = document.getElementById("guestName");
  const fileInput   = document.getElementById("fileInput");
  const dropZone    = document.getElementById("dropZone");
  const previewGrid = document.getElementById("previewGrid");
  const uploadBtn   = document.getElementById("uploadBtn");
  const toast       = document.getElementById("toast");
  const overallProgress = document.getElementById("overallProgress");
  const opFill      = document.getElementById("opFill");
  const opText      = document.getElementById("opText");
  const opPercent   = document.getElementById("opPercent");

  let selectedFiles = [];

  // ── File selection ──────────────────────────────────────────────────────

  fileInput.addEventListener("change", () => {
    selectedFiles = Array.from(fileInput.files);
    renderPreviews();
  });

  // Drag-and-drop (desktop bonus)
  dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("over");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("over");
    selectedFiles = Array.from(e.dataTransfer.files);
    renderPreviews();
  });

  function renderPreviews() {
    previewGrid.innerHTML = "";
    previewGrid.style.display = selectedFiles.length ? "grid" : "none";

    selectedFiles.forEach((file, i) => {
      const item = document.createElement("div");
      item.className = "preview-item";
      item.id = `pi-${i}`;

      // URL.createObjectURL is purely local — nothing is sent to the server here.
      const src = URL.createObjectURL(file);
      if (file.type.startsWith("video/")) {
        const v = document.createElement("video");
        v.src = src;
        v.muted = true;
        v.playsInline = true;
        v.preload = "metadata";
        item.appendChild(v);
      } else {
        const img = new Image();
        img.src = src;
        img.alt = file.name;
        item.appendChild(img);
      }

      const badge = document.createElement("div");
      badge.className = "preview-badge badge-pending";
      badge.textContent = truncate(file.name, 14);
      item.appendChild(badge);

      const bar = document.createElement("div");
      bar.className = "preview-progress";
      item.appendChild(bar);

      previewGrid.appendChild(item);
    });

    uploadBtn.disabled = false;
    const n = selectedFiles.length;
    uploadBtn.textContent = `Upload ${n} photo${n === 1 ? "" : "s"}`;
    hideToast();
  }

  // ── Upload ──────────────────────────────────────────────────────────────

  // Tracks bytes uploaded per file so we can compute an overall percentage
  // even while several files upload at the same time.
  let loadedBytes = [];
  let totalBytes  = 0;

  uploadBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      showToast("Please enter your name first.", "error");
      return;
    }

    // Client-side guard (server also validates)
    const bad = selectedFiles.filter(f => !ALLOWED.has(f.type) || f.size > MAX_SIZE);
    if (bad.length) {
      showToast(
        `${bad.length} file${bad.length > 1 ? "s" : ""} skipped: unsupported type or over 500 MB.`,
        "error"
      );
      selectedFiles = selectedFiles.filter(f => ALLOWED.has(f.type) && f.size <= MAX_SIZE);
      if (!selectedFiles.length) return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = "Uploading…";
    hideToast();

    // Reset progress accounting for this run.
    loadedBytes = selectedFiles.map(() => 0);
    totalBytes  = selectedFiles.reduce((sum, f) => sum + f.size, 0);
    showOverall(true);
    updateOverall();

    let ok = 0, fail = 0;

    // Parallel worker pool: several files upload concurrently (faster on the
    // fast up-links guests usually have), but we cap how many run at once so a
    // phone on mobile data isn't overwhelmed.  Each worker pulls the next index
    // off a shared counter until the queue is drained.
    let next = 0;
    async function worker() {
      while (next < selectedFiles.length) {
        const i = next++;
        const result = await uploadOne(i, name);
        if (result) ok++; else fail++;
      }
    }

    const workers = [];
    for (let w = 0; w < Math.min(MAX_PARALLEL, selectedFiles.length); w++) {
      workers.push(worker());
    }
    await Promise.all(workers);

    showOverall(false);
    uploadBtn.textContent = "Upload more";
    uploadBtn.disabled = false;

    if (fail === 0) {
      showToast(`All ${ok} file${ok === 1 ? "" : "s"} uploaded! Thank you 🎉`, "success");
    } else if (ok === 0) {
      showToast(`All uploads failed. Check your connection and try again.`, "error");
    } else {
      showToast(`${ok} uploaded, ${fail} failed. You can retry the failed ones.`, "info");
    }
  });

  // Upload a single file: get a presigned URL, then PUT it to R2 with an XHR so
  // we get real upload-progress events (fetch() gives no upload progress).
  // Returns true on success, false on failure.
  async function uploadOne(i, name) {
    const file = selectedFiles[i];
    setBadge(i, "uploading", "0%");

    try {
      // Step 1 — ask our server for a presigned PUT URL.
      const res = await fetch("/api/upload-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          filename:     file.name,
          content_type: file.type,
          guest_name:   name,
          file_size:    file.size,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const { url } = await res.json();

      // Step 2 — PUT the file DIRECTLY to R2 via XHR (progress-aware).
      // Our server is NOT in the data path; R2 receives the bytes.
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url);
        xhr.setRequestHeader("Content-Type", file.type);

        xhr.upload.onprogress = e => {
          if (!e.lengthComputable) return;
          loadedBytes[i] = e.loaded;
          const pct = Math.round((e.loaded / e.total) * 100);
          setItemProgress(i, pct);
          setBadge(i, "uploading", pct + "%");
          updateOverall();
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error(`R2 rejected upload: ${xhr.status}`));
        };
        xhr.onerror = () => reject(new Error("Network error during upload"));
        xhr.onabort = () => reject(new Error("Upload aborted"));

        xhr.send(file);
      });

      // Count the full size in case the last progress event undershot.
      loadedBytes[i] = file.size;
      updateOverall();
      setItemProgress(i, 100);
      setBadge(i, "done", "✓ Done");
      return true;
    } catch (err) {
      loadedBytes[i] = 0;
      updateOverall();
      setBadge(i, "error", "✗ Failed");
      console.error("Upload error for", file.name, err);
      return false;
    }
  }

  function updateOverall() {
    if (!totalBytes) return;
    const loaded = loadedBytes.reduce((a, b) => a + b, 0);
    const pct = Math.min(100, Math.round((loaded / totalBytes) * 100));
    opFill.style.width = pct + "%";
    opPercent.textContent = pct + "%";
  }

  function showOverall(show) {
    overallProgress.style.display = show ? "block" : "none";
    if (show) {
      opFill.style.width = "0%";
      opPercent.textContent = "0%";
      opText.textContent = "Uploading…";
    }
  }

  function setItemProgress(index, pct) {
    const item = document.getElementById(`pi-${index}`);
    if (!item) return;
    const bar = item.querySelector(".preview-progress");
    if (bar) bar.style.width = pct + "%";
  }

  // ── Utilities ────────────────────────────────────────────────────────────

  function setBadge(index, type, text) {
    const item = document.getElementById(`pi-${index}`);
    if (!item) return;
    const badge = item.querySelector(".preview-badge");
    badge.className = `preview-badge badge-${type}`;
    badge.textContent = text;
  }

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = `toast ${type}`;
    toast.style.display = "block";
  }

  function hideToast() {
    toast.style.display = "none";
  }

  function truncate(str, max) {
    return str.length > max ? str.slice(0, max - 1) + "…" : str;
  }
</script>
</body>
</html>
