<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share your photos</title>
  <meta name="theme-color" content="#FBF7F2" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    main { max-width: 480px; margin: 0 auto; padding: 0 1rem 3rem; }
    .welcome { text-align: center; padding: 2.25rem .5rem 1.5rem; }
    .welcome .kicker { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .welcome h1 {
      font-family: var(--serif); font-weight: 600; font-size: clamp(2.4rem, 11vw, 3.2rem);
      line-height: 1.05; margin: .4rem 0 .5rem; overflow-wrap: anywhere;
    }
    .welcome p { color: var(--ink-soft); }
    .ornament { color: var(--accent); margin-top: .75rem; letter-spacing: .5em; font-size: .8rem; }

    .drop-zone {
      position: relative; display: block; text-align: center; cursor: pointer;
      border: 2px dashed #DCCFC3; border-radius: 18px; padding: 1.6rem 1rem;
      background: var(--bg); transition: border-color .15s, background .15s; margin-bottom: 1rem;
    }
    .drop-zone.over, .drop-zone:hover { border-color: var(--accent); background: var(--accent-soft); }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; width: 100%; }
    .dz-cta {
      display: inline-flex; align-items: center; gap: .5rem; background: var(--accent); color: #fff;
      border-radius: 999px; padding: .85rem 1.4rem; font-weight: 600; box-shadow: 0 6px 18px rgba(158,79,69,.22);
    }
    .dz-secondary { color: var(--muted); font-size: .8rem; margin-top: .6rem; }

    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 1rem; }
    .preview-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg-deep); }
    .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
    .preview-badge {
      position: absolute; left: 6px; bottom: 7px; padding: 2px 7px; border-radius: 999px;
      font-size: .64rem; font-weight: 600; color: #fff; max-width: calc(100% - 12px);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badge-pending   { background: rgba(43,36,32,.55); }
    .badge-uploading { background: rgba(158,79,69,.92); }
    .badge-done      { background: rgba(47,125,79,.92); }
    .badge-error     { background: rgba(163,58,47,.95); }
    .preview-progress { position: absolute; left: 0; bottom: 0; height: 4px; width: 0%; background: var(--ok); transition: width .15s ease-out; }

    .overall-progress { display: none; margin-bottom: 1rem; }
    .op-label { display: flex; justify-content: space-between; font-size: .82rem; color: var(--ink-soft); margin-bottom: .35rem; font-weight: 500; }
    .op-track { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .op-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 6px; transition: width .2s ease-out; }

    .toast { margin-top: 1rem; padding: .8rem 1rem; border-radius: 12px; font-size: .9rem; text-align: center; display: none; }
    .toast.success { background: var(--ok-soft); color: var(--ok); }
    .toast.error   { background: var(--err-soft); color: var(--err); }
    .toast.info    { background: var(--bg-deep); color: var(--ink-soft); }

    .privacy { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 1rem; }
    .couple-link { text-align: center; margin-top: 2rem; font-size: .82rem; color: var(--muted); }
    .couple-link a { color: var(--muted); }
    .made-with { text-align: center; margin-top: .6rem; font-size: .78rem; color: #B5AAA1; }
    .made-with a { color: inherit; }
  </style>
</head>
<body>

<main>
  <div class="welcome">
    <div class="kicker">Share your photos</div>
    <h1 id="brand">&nbsp;</h1>
    <p id="uploadSubtitle">Help us capture every moment of our day.</p>
    <div class="ornament">✦ ✦ ✦</div>
  </div>

  <!-- Active gallery: the upload form -->
  <div class="card" id="uploadCard" style="display:none">
    <div class="field">
      <label class="label" for="guestName">Your name</label>
      <input class="input" type="text" id="guestName" placeholder="e.g. Eleni Georgiou"
             autocomplete="name" autocorrect="off" spellcheck="false" />
      <p class="hint">So the couple knows who took them.</p>
    </div>

    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple accept="image/*,video/*" />
      <span class="dz-cta">＋ Choose photos &amp; videos</span>
      <p class="dz-secondary">Pick as many as you like · Up to 500 MB each</p>
    </label>

    <div class="preview-grid" id="previewGrid" style="display:none"></div>

    <div class="overall-progress" id="overallProgress">
      <div class="op-label"><span>Uploading… please keep this page open</span><span id="opPercent">0%</span></div>
      <div class="op-track"><div class="op-fill" id="opFill"></div></div>
    </div>

    <button class="btn btn-lg btn-block" id="uploadBtn" disabled>Choose photos first</button>

    <div class="toast" id="toast"></div>
    <p class="privacy">🔒 Only the couple can see what you upload.</p>
  </div>

  <!-- Inactive / not-found states -->
  <div class="card" id="stateCard" style="display:none">
    <div class="state" id="stateMsg"><div class="spinner"></div>Loading…</div>
  </div>

  <p class="couple-link">Are you the couple? <a href="#" id="loginLink">Open your gallery</a></p>
  <p class="made-with">Made with <a href="/" target="_blank">Confetti</a></p>
</main>

<script src="/static/confetti.js"></script>
<script>
  "use strict";

  // ── Multi-tenant: this event's slug lives in the URL (/e/<slug>)
  const SLUG = location.pathname.split("/")[2] || "";
  const API  = `/api/e/${SLUG}`;

  const MAX_SIZE = 500 * 1024 * 1024;
  const ALLOWED = new Set([
    "image/jpeg","image/png","image/gif","image/webp",
    "image/heic","image/heif",
    "video/mp4","video/quicktime","video/x-msvideo",
  ]);

  const uploadCard  = document.getElementById("uploadCard");
  const stateCard   = document.getElementById("stateCard");
  const stateMsg    = document.getElementById("stateMsg");
  const brand       = document.getElementById("brand");
  const loginLink   = document.getElementById("loginLink");
  const subtitle    = document.getElementById("uploadSubtitle");
  const nameInput   = document.getElementById("guestName");
  const fileInput   = document.getElementById("fileInput");
  const dropZone    = document.getElementById("dropZone");
  const previewGrid = document.getElementById("previewGrid");
  const uploadBtn   = document.getElementById("uploadBtn");
  const toast       = document.getElementById("toast");
  const overallProgress = document.getElementById("overallProgress");
  const opFill      = document.getElementById("opFill");
  const opPercent   = document.getElementById("opPercent");

  let selectedFiles = [];

  loginLink.href = `/e/${SLUG}/gallery`;

  // Remember the guest's name so a second batch later in the night is one tap.
  try { nameInput.value = localStorage.getItem("confetti_guest_name") || ""; } catch {}
  nameInput.addEventListener("change", () => {
    try { localStorage.setItem("confetti_guest_name", nameInput.value.trim()); } catch {}
  });

  // ── Boot: fetch this event's info (WED-4 name + WED-7 paywall gate) ───────
  (async () => {
    try {
      const res = await fetch(`${API}/info`);
      if (res.status === 404) return showState("💌", "This gallery link isn't valid. Please double-check with the couple.");
      const info = await res.json();

      brand.textContent = info.names || "Our wedding";
      if (info.names) {
        document.title = `Share your photos · ${info.names}`;
      }

      if (info.active) {
        showState(null);              // hide state card
        uploadCard.style.display = "block";
      } else {
        showState("🔒", "This gallery isn't active yet. The couple needs to finish setting it up. Please check back soon!");
      }
    } catch {
      showState("⚠️", "Couldn't load this gallery. Please check your connection and try again.");
    }
  })();

  function showState(icon, text) {
    if (icon === null) { stateCard.style.display = "none"; return; }
    uploadCard.style.display = "none";
    stateCard.style.display = "block";
    stateMsg.innerHTML = `<span class="ico">${icon}</span>${text}`;
  }

  // ── File selection ──────────────────────────────────────────────────────

  fileInput.addEventListener("change", () => {
    selectedFiles = Array.from(fileInput.files);
    renderPreviews();
  });

  dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("over");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("over");
    selectedFiles = Array.from(e.dataTransfer.files);
    renderPreviews();
  });

  function renderPreviews() {
    previewGrid.innerHTML = "";
    previewGrid.style.display = selectedFiles.length ? "grid" : "none";

    selectedFiles.forEach((file, i) => {
      const item = document.createElement("div");
      item.className = "preview-item";
      item.id = `pi-${i}`;

      const src = URL.createObjectURL(file);
      if (file.type.startsWith("video/")) {
        const v = document.createElement("video");
        v.src = src;
        v.muted = true;
        v.playsInline = true;
        v.preload = "metadata";
        item.appendChild(v);
      } else {
        const img = new Image();
        img.src = src;
        img.alt = file.name;
        item.appendChild(img);
      }

      const badge = document.createElement("div");
      badge.className = "preview-badge badge-pending";
      badge.textContent = truncate(file.name, 14);
      item.appendChild(badge);

      const bar = document.createElement("div");
      bar.className = "preview-progress";
      item.appendChild(bar);

      previewGrid.appendChild(item);
    });

    uploadBtn.disabled = false;
    const n = selectedFiles.length;
    uploadBtn.textContent = `Upload ${n} file${n === 1 ? "" : "s"}`;
    hideToast();
  }

  // ── Upload ──────────────────────────────────────────────────────────────
  // Uploads run CONCURRENTLY (a small pool) with a live % per file. Files still
  // go browser → R2 directly; parallelism + real progress is what makes big
  // batches (and videos) feel fast instead of frozen.

  const CONCURRENCY = 3;

  // Bytes sent per file, so the overall bar is right while files run in parallel.
  let loadedBytes = [];
  let totalBytes  = 0;

  uploadBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      showToast("Please enter your name first.", "error");
      return;
    }

    const bad = selectedFiles.filter(f => !ALLOWED.has(f.type) || f.size > MAX_SIZE);
    if (bad.length) {
      showToast(
        `${bad.length} file${bad.length > 1 ? "s" : ""} skipped: unsupported type or over 500 MB.`,
        "error"
      );
      selectedFiles = selectedFiles.filter(f => ALLOWED.has(f.type) && f.size <= MAX_SIZE);
      if (!selectedFiles.length) return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = "Uploading…";
    hideToast();

    loadedBytes = selectedFiles.map(() => 0);
    totalBytes  = selectedFiles.reduce((sum, f) => sum + f.size, 0);
    showOverall(true);

    let ok = 0, fail = 0, cursor = 0;
    const failed = [];

    // Worker pool: each worker grabs the next file until the queue is drained.
    async function worker() {
      while (cursor < selectedFiles.length) {
        const i = cursor++;
        try {
          await uploadOne(i, selectedFiles[i]);
          ok++;
        } catch (err) {
          console.error("Upload error for", selectedFiles[i] && selectedFiles[i].name, err);
          setBadge(i, "error", "✗ Failed");
          failed.push(selectedFiles[i]);
          loadedBytes[i] = 0;
          updateOverall();
          fail++;
        }
      }
    }

    const pool = Array.from({ length: Math.min(CONCURRENCY, selectedFiles.length) }, worker);
    await Promise.all(pool);

    showOverall(false);
    // Keep only the failures queued, so a retry never duplicates what already
    // arrived. On full success the button waits for a new selection.
    selectedFiles = failed;
    fileInput.value = "";
    if (fail) renderPreviews();   // grid now shows just the files to retry
    uploadBtn.disabled = fail === 0;
    uploadBtn.textContent = fail
      ? `Retry ${fail} failed upload${fail === 1 ? "" : "s"}`
      : "Choose more photos above";

    if (fail === 0) {
      showToast(`All ${ok} file${ok === 1 ? "" : "s"} uploaded. Thank you! 🎉`, "success");
      window.confettiBurst();
    } else if (ok === 0) {
      showToast(`All uploads failed. Check your connection and try again.`, "error");
    } else {
      showToast(`${ok} uploaded, ${fail} failed. Tap "Retry" to try the failed ones again.`, "info");
    }
  });

  async function uploadOne(i, file) {
    setBadge(i, "uploading", "0%");

    // Step 1: presigned PUT URL from our server (validates type + size).
    const res = await fetch(`${API}/upload-url`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        filename:     file.name,
        content_type: file.type,
        guest_name:   nameInput.value.trim(),
        file_size:    file.size,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server error ${res.status}`);
    }
    const { url } = await res.json();

    // Step 2: PUT straight to R2, with progress (XHR exposes upload progress; fetch doesn't).
    await putWithProgress(url, file, (pct, loaded) => {
      loadedBytes[i] = loaded;
      setItemProgress(i, pct);
      setBadge(i, "uploading", pct + "%");
      updateOverall();
    });
    loadedBytes[i] = file.size;   // in case the last progress event undershot
    updateOverall();
    setItemProgress(i, 100);
    setBadge(i, "done", "✓ Done");
  }

  function putWithProgress(url, file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", url);
      xhr.setRequestHeader("Content-Type", file.type);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100), e.loaded);
      };
      xhr.onload = () =>
        (xhr.status >= 200 && xhr.status < 300)
          ? resolve()
          : reject(new Error(`R2 rejected upload: ${xhr.status}`));
      xhr.onerror = () => reject(new Error("network error"));
      xhr.send(file);
    });
  }

  function updateOverall() {
    if (!totalBytes) return;
    const loaded = loadedBytes.reduce((a, b) => a + b, 0);
    const pct = Math.min(100, Math.round((loaded / totalBytes) * 100));
    opFill.style.width = pct + "%";
    opPercent.textContent = pct + "%";
  }

  function showOverall(show) {
    overallProgress.style.display = show ? "block" : "none";
    if (show) { opFill.style.width = "0%"; opPercent.textContent = "0%"; }
  }

  function setItemProgress(index, pct) {
    const bar = document.querySelector(`#pi-${index} .preview-progress`);
    if (bar) bar.style.width = pct + "%";
  }

  // ── Utilities ────────────────────────────────────────────────────────────

  function setBadge(index, type, text) {
    const item = document.getElementById(`pi-${index}`);
    if (!item) return;
    const badge = item.querySelector(".preview-badge");
    badge.className = `preview-badge badge-${type}`;
    badge.textContent = text;
  }

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = `toast ${type}`;
    toast.style.display = "block";
  }

  function hideToast() { toast.style.display = "none"; }

  function truncate(str, max) {
    return str.length > max ? str.slice(0, max - 1) + "…" : str;
  }
</script>
</body>
</html>
