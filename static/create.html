<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get started · Confetti</title>
  <meta name="theme-color" content="#F3EDE4" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .stepper { display: flex; justify-content: center; gap: .5rem; margin-bottom: 1.25rem; font-size: .78rem; color: var(--muted); }
    .stepper span { padding: .3rem .7rem; border-radius: 999px; background: var(--bg-deep); }
    .stepper span.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .preview-name {
      text-align: center; font-family: var(--serif); font-size: 1.5rem; font-weight: 400; color: var(--accent);
      margin: -.25rem 0 1rem;
    }
    .preview-name:empty { display: none; }
    #codeField { display: none; }
    .req { color: var(--accent); }
    .meter { display: flex; gap: 4px; margin-top: .5rem; }
    .meter i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
    .meter[data-score="1"] i:nth-child(-n+1) { background: #C9573F; }
    .meter[data-score="2"] i:nth-child(-n+2) { background: #D99A3B; }
    .meter[data-score="3"] i:nth-child(-n+3) { background: #7BA05B; }
    .meter[data-score="4"] i { background: var(--ok); }
    .rules { list-style: none; display: flex; flex-wrap: wrap; gap: .2rem .9rem; margin-top: .45rem; font-size: .78rem; color: var(--muted); }
    .rules li::before { content: "○ "; }
    .rules li.ok { color: var(--ok); }
    .rules li.ok::before { content: "✓ "; }
    .suggest { font-size: .82rem; margin-top: .35rem; color: var(--ink-soft); display: none; }
    .plans { display: grid; gap: .55rem; margin-bottom: 1.4rem; }
    .plan { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; border: 1.5px solid var(--line); border-radius: 14px;
      background: #FFFDFB; cursor: pointer; text-align: left; font: inherit; color: var(--ink); width: 100%; position: relative; }
    .plan[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .plan .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #CDBFB3; flex-shrink: 0; }
    .plan[aria-checked="true"] .dot { border: 5px solid var(--accent); }
    .plan b { display: block; font-size: .98rem; }
    .plan small { color: var(--muted); font-size: .8rem; line-height: 1.35; display: block; }
    .plan .price { margin-left: auto; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
    .plan .tag { position: absolute; top: -9px; right: 12px; background: var(--gold); color: #3B2A10; font-size: .68rem; font-weight: 700;
      letter-spacing: .04em; padding: .1rem .5rem; border-radius: 999px; }
    .suggest button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: inherit; padding: 0; text-decoration: underline; }
  </style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand"><img src="/static/favicon.svg" alt="" /><span>Confetti</span></a>
  <nav class="nav"><a href="/login" class="btn btn-sm">Log in</a></nav>
</header>

<main class="narrow">
  
  <div class="card">
    <h1 class="page-title">Get started</h1>
    <p class="page-sub">Pay once. No subscription.</p>
    <form id="form" novalidate>
      <div class="plans" role="radiogroup" aria-label="What would you like?">
        <button type="button" class="plan" role="radio" data-plan="photos" aria-checked="false"><span class="dot"></span>
          <span><b>Photo gallery</b><small>QR code and private gallery</small></span><span class="price">€25</span></button>
        <button type="button" class="plan" role="radio" data-plan="invite" aria-checked="false"><span class="dot"></span>
          <span><b>Invitation + RSVP</b><small>Five website designs, with replies</small></span><span class="price">€20</span></button>
        <button type="button" class="plan" role="radio" data-plan="bundle" aria-checked="true"><span class="tag">SAVE €6</span><span class="dot"></span>
          <span><b>Both</b><small>Invitation and photo gallery</small></span><span class="price">€39</span></button>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="label" for="name1">Your name</label>
          <input class="input" type="text" id="name1" placeholder="Sofia" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label class="label" for="name2">Partner's name</label>
          <input class="input" type="text" id="name2" placeholder="Daniel" autocomplete="off" required />
        </div>
      </div>
      <div class="preview-name" id="previewName" aria-live="polite"></div>

      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required />
        <p class="suggest" id="suggest">Did you mean <button type="button" id="suggestBtn"></button>?</p>

      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="input" type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" id="pwToggle">Show</button>
        </div>
        <div class="meter" id="meter" data-score="0"><i></i><i></i><i></i><i></i></div>
        <ul class="rules">
          <li id="rLen">8+ characters</li><li id="rLetter">A letter</li><li id="rNum">A number</li>
        </ul>

      </div>

      <div class="field" id="codeField">
        <label class="label" for="accessCode">Access code</label>
        <input class="input" type="text" id="accessCode" placeholder="Enter your code" autocomplete="off" autocapitalize="characters" />
      </div>
      <p style="text-align:right; margin:-.4rem 0 .25rem"><button type="button" class="link-btn" id="codeToggle">Have an access code?</button></p>

      <button class="btn btn-lg btn-block" id="submitBtn" type="submit" style="margin-top:.75rem">Continue</button>

      <p class="hint" style="text-align:center">By continuing you agree to our <a href="/terms" target="_blank">Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</p>
      <div class="alert alert-error" id="error" role="alert"></div>
    </form>
  </div>
  <p class="foot-note">Already have an account? <a href="/login">Log in</a></p>
</main>

<script>
  "use strict";
  const $ = id => document.getElementById(id);
  const name1El = $("name1"), name2El = $("name2"), emailEl = $("email"),
        pwEl = $("password"), codeEl = $("accessCode"), btn = $("submitBtn"), errorEl = $("error");

  function showError(msg) { errorEl.innerHTML = msg; errorEl.classList.add("show"); }
  function hideError() { errorEl.classList.remove("show"); }

  function idleLabel() { return codeEl.value.trim() ? "Create my account" : `Continue · ${PLAN_INFO[plan][1]}`; }

  // Photos, invitation or both (?plan=invite|bundle preselects).
  const PLAN_INFO = {
    photos: ["Photo gallery · 12 months", "€25"],
    invite: ["Invitation + RSVP", "€20"],
    bundle: ["Invitation + photo gallery", "€39"],
  };
  let plan = new URLSearchParams(location.search).get("plan");
  if (!PLAN_INFO[plan]) plan = "bundle";
  function setPlan(p) {
    plan = p;
    document.querySelectorAll(".plan").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.plan === p)));
    btn.textContent = idleLabel();
  }
  document.querySelectorAll(".plan").forEach((b) => b.addEventListener("click", () => setPlan(b.dataset.plan)));
  setPlan(plan);

  // Live preview of how the names will appear on their pages.
  function updatePreview() {
    const a = name1El.value.trim(), b = name2El.value.trim();
    $("previewName").textContent = a && b ? `${a} & ${b}` : (a || b);
  }
  name1El.addEventListener("input", updatePreview);
  name2El.addEventListener("input", updatePreview);

  // Password rules: mirrored on the server (main.py, check_password).
  function pwChecks(v) {
    return { len: v.length >= 8, letter: /[A-Za-z]/.test(v), num: /\d/.test(v) };
  }
  pwEl.addEventListener("input", () => {
    const v = pwEl.value, c = pwChecks(v);
    $("rLen").classList.toggle("ok", c.len);
    $("rLetter").classList.toggle("ok", c.letter);
    $("rNum").classList.toggle("ok", c.num);
    let score = 0;
    if (v) score = 1;
    if (c.len && c.letter && c.num) score = 2;
    if (score === 2 && (v.length >= 12 || /[^A-Za-z0-9]/.test(v))) score = 3;
    if (score === 3 && v.length >= 12 && /[^A-Za-z0-9]/.test(v) && /[a-z]/.test(v) && /[A-Z]/.test(v)) score = 4;
    $("meter").dataset.score = score;
  });

  // Catch common email-domain typos (gmai1l.com, hotmial.com...) before submit.
  const DOMAINS = ["gmail.com", "hotmail.com", "outlook.com", "yahoo.com", "icloud.com",
                   "live.com", "protonmail.com", "proton.me", "aol.com", "msn.com", "me.com"];
  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function checkTypo() {
    const v = emailEl.value.trim(), at = v.lastIndexOf("@");
    $("suggest").style.display = "none";
    if (at < 1) return;
    const dom = v.slice(at + 1).toLowerCase();
    if (!dom || DOMAINS.includes(dom)) return;
    const best = DOMAINS.map(d => [d, distance(dom, d)]).sort((x, y) => x[1] - y[1])[0];
    if (best[1] > 0 && best[1] <= 2) {
      const fixed = v.slice(0, at + 1) + best[0];
      $("suggestBtn").textContent = fixed;
      $("suggest").style.display = "block";
    }
  }
  emailEl.addEventListener("blur", checkTypo);
  $("suggestBtn").addEventListener("click", () => {
    emailEl.value = $("suggestBtn").textContent;
    $("suggest").style.display = "none";
  });

  // Coming back from Stripe with the Back button restores this page from the
  // browser cache with the button still saying "Setting up…". Re-enable it.
  window.addEventListener("pageshow", () => {
    btn.disabled = false;
    btn.textContent = idleLabel();
  });

  $("pwToggle").addEventListener("click", () => {
    const show = pwEl.type === "password";
    pwEl.type = show ? "text" : "password";
    $("pwToggle").textContent = show ? "Hide" : "Show";
  });

  $("codeToggle").addEventListener("click", () => {
    $("codeField").style.display = "block";
    $("codeToggle").parentElement.style.display = "none";
    codeEl.focus();
  });
  codeEl.addEventListener("input", () => { btn.textContent = idleLabel(); });

  $("form").addEventListener("submit", submit);

  async function submit(e) {
    e.preventDefault();
    hideError();
    const p1 = name1El.value.trim();
    const p2 = name2El.value.trim();
    const email = emailEl.value.trim();
    const password = pwEl.value;

    if (!p1 || !p2) return showError("Please enter both names.");
    if (!email.includes("@")) return showError("Please enter a valid email.");
    const c = pwChecks(password);
    if (!c.len) return showError("Password must be at least 8 characters.");
    if (!c.letter || !c.num) return showError("Password needs at least one letter and one number.");

    // Combine the two fields into the display name shown at the top of the pages.
    const couple_names = `${p1} & ${p2}`;

    btn.disabled = true;
    btn.textContent = "Setting up…";

    try {
      const res = await fetch("/api/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ couple_names, password, email, plan, access_code: codeEl.value.trim() || null }),
      });

      if (res.status === 409) {
        showError('That email already has an account. <a href="/login">Log in instead</a>.');
        btn.disabled = false;
        btn.textContent = idleLabel();
        return;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        // Validation errors arrive as [{msg: "Value error, ..."}]; show just the message.
        const detail = Array.isArray(err.detail)
          ? (err.detail[0]?.msg || "").replace(/^Value error, /, "")
          : err.detail;
        throw new Error(detail || `Server error ${res.status}`);
      }

      const { payment_url } = await res.json();
      // Either Stripe's hosted checkout, or (free path) our own success page.
      window.location.href = payment_url;
    } catch (err) {
      showError(typeof err.message === "string" ? err.message : "Something went wrong. Please try again.");
      btn.disabled = false;
      btn.textContent = idleLabel();
    }
  }
</script>
</body>
</html>
