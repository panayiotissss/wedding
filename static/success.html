<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Confirming your payment · Confetti</title>
  <meta name="theme-color" content="#22332B" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<header class="topbar">
  <a href="/" class="brand"><img src="/static/favicon.svg" alt="" /><span>Confetti</span></a>
</header>
<main class="narrow">
  <div class="card state" id="state" role="status">
    <div class="spinner"></div>
    <h1 class="page-title">Confirming your payment</h1>
  </div>
</main>
<script>
  "use strict";
  // Stripe sends couples here; once the payment is confirmed they go to their home page.
  (async () => {
    const params = new URLSearchParams(location.search);
    let slug = params.get("slug"), addon = null;
    try { const l = await (await fetch("/api/my-latest")).json(); slug = slug || l.slug; addon = l.addon; } catch {}
    if (!slug) { location.replace("/login"); return; }
    let tries = 0;
    (async function poll() {
      try {
        const r = await fetch(`/api/events/${encodeURIComponent(slug)}/status`);
        if (r.ok) {
          const info = await r.json();
          if (info.status === "active" && (!addon || info[addon])) { location.replace(info.next); return; }
        }
      } catch { /* try again */ }
      if (++tries > 40) { location.replace("/login"); return; }   // ~2 minutes: let them log in instead
      setTimeout(poll, 3000);
    })();
  })();
</script>
</body>
</html>
