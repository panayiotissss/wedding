<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your gallery is ready — Confetti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --rose: #c9a9a6; --rose-dark: #b89490; --ink: #4a4442;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      background: linear-gradient(160deg, #faf8f5 0%, #f4ece6 100%);
      background-attachment: fixed; color: #333; min-height: 100vh;
    }
    header { padding: 1rem 1.5rem; max-width: 1000px; margin: 0 auto; }
    .brand { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; color: var(--ink); text-decoration: none; }

    main { max-width: 460px; margin: 2rem auto 3rem; padding: 0 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 2.25rem 1.75rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
    .card h1 { font-family: var(--serif); font-size: 2rem; font-weight: 600; color: var(--ink); margin-bottom: 0.4rem; }
    .card .sub { color: #a79b94; font-size: 0.9rem; margin-bottom: 1.5rem; }

    .qr-wrap { margin: 1.25rem auto; }
    .qr-wrap img { width: 220px; height: 220px; border-radius: 8px; border: 1px solid #ede8e1; }

    .link-box {
      display: flex; align-items: center; gap: 0.5rem; background: #fdfcfb; border: 1.5px solid #eee;
      border-radius: 8px; padding: 0.6rem 0.75rem; margin: 0.75rem 0; font-size: 0.85rem; word-break: break-all;
    }
    .link-box a { color: var(--rose-dark); text-decoration: none; }

    .btn { display: block; width: 100%; padding: 0.8rem; background: var(--rose); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: background 0.15s; margin-top: 0.6rem; letter-spacing: 0.02em; }
    .btn:hover { background: var(--rose-dark); }
    .btn-outline { background: transparent; color: var(--rose-dark); border: 1.5px solid var(--rose); }
    .btn-outline:hover { background: #fdf0ef; }

    .waiting { padding: 3rem 1rem; color: #9a8f88; }
    .spinner { font-size: 2.5rem; display: block; margin-bottom: 1rem; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #b3a89f; margin: 1.5rem 0 0.4rem; text-align: left; }
  </style>
</head>
<body>

<header><a href="/" class="brand">Confetti</a></header>

<main>
  <div class="card" id="card">
    <div class="waiting" id="waiting">
      <span class="spinner">⏳</span>
      Confirming your payment…<br>This usually takes a few seconds.
    </div>

    <div id="ready" style="display:none">
      <h1>You're all set! 🎉</h1>
      <p class="sub" id="readySub">Your gallery is live.</p>

      <div class="qr-wrap"><img id="qrImg" alt="Your QR code" /></div>
      <p class="sub">Print this QR code for your tables. Guests scan it to upload.</p>
      <a class="btn btn-outline" id="qrDownload" download="wedding_qr.png">↓ Download QR code</a>

      <div class="section-label">Guest upload page</div>
      <div class="link-box"><a id="uploadLink" href="#" target="_blank"></a></div>

      <div class="section-label">Your private gallery</div>
      <div class="link-box"><a id="galleryLink" href="#" target="_blank"></a></div>

      <a class="btn" id="openGallery" href="#">Open my gallery</a>
    </div>
  </div>
</main>

<script>
  "use strict";
  const params = new URLSearchParams(location.search);

  const waiting = document.getElementById("waiting");
  const ready   = document.getElementById("ready");

  let slug = params.get("slug");

  // After a Stripe Payment Link, the return URL has no slug — recover the
  // gallery this session just created.
  (async () => {
    if (!slug) {
      try { slug = (await (await fetch("/api/my-latest")).json()).slug; } catch {}
    }
    if (!slug) {
      waiting.innerHTML = "We couldn't find your gallery. <a href='/create'>Start again</a>.";
      return;
    }
    poll();
  })();

  async function poll() {
    try {
      const res = await fetch(`/api/events/${slug}/status`);
      if (res.ok) {
        const info = await res.json();
        if (info.status === "active") return showReady(info);
      }
    } catch { /* retry */ }
    setTimeout(poll, 2500);
  }

  function showReady(info) {
    const origin = location.origin;
    const uploadUrl  = `${origin}/e/${slug}`;
    const galleryUrl = `${origin}/e/${slug}/gallery`;

    document.getElementById("readySub").textContent =
      info.names ? `${info.names} your gallery is live.` : "Your gallery is live.";

    const qr = document.getElementById("qrImg");
    qr.src = `/e/${slug}/qr.png`;
    document.getElementById("qrDownload").href = `/e/${slug}/qr.png`;

    const up = document.getElementById("uploadLink");
    up.textContent = uploadUrl; up.href = uploadUrl;
    const gl = document.getElementById("galleryLink");
    gl.textContent = galleryUrl; gl.href = galleryUrl;
    document.getElementById("openGallery").href = galleryUrl;

    waiting.style.display = "none";
    ready.style.display = "block";
  }
</script>
</body>
</html>
