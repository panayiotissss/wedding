<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Confetti</title>
  <meta name="theme-color" content="#FBF7F2" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<header class="topbar">
  <a href="/" class="brand"><img src="/static/favicon.svg" alt="" /><span>Confetti</span></a>
  <nav class="nav"><a href="/create" class="nav-link">Create a gallery</a></nav>
</header>

<main class="narrow" style="margin-top:3rem">
  <div class="card">
    <h1 class="page-title">Welcome back</h1>
    <p class="page-sub">Log in to see your photos.</p>

    <form id="form" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email" />
      </div>
      <div class="field">
        <label class="label" for="password">Gallery password</label>
        <div class="pw-wrap">
          <input class="input" type="password" id="password" placeholder="Your gallery password" autocomplete="current-password" />
          <button type="button" class="pw-toggle" id="pwToggle">Show</button>
        </div>
      </div>
      <button class="btn btn-lg btn-block" id="loginBtn" type="submit">Log in</button>
      <div class="alert alert-error" id="error" role="alert"></div>
    </form>
  </div>
  <p class="foot-note">No gallery yet? <a href="/create">Create one for €25</a></p>
</main>

<script>
  "use strict";
  const emailEl = document.getElementById("email");
  const pwEl    = document.getElementById("password");
  const btn     = document.getElementById("loginBtn");
  const errorEl = document.getElementById("error");

  function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }

  document.getElementById("pwToggle").addEventListener("click", e => {
    const show = pwEl.type === "password";
    pwEl.type = show ? "text" : "password";
    e.target.textContent = show ? "Hide" : "Show";
  });

  document.getElementById("form").addEventListener("submit", login);

  async function login(e) {
    e.preventDefault();
    errorEl.classList.remove("show");
    const email = emailEl.value.trim();
    const password = pwEl.value;
    if (!email || !password) return showError("Enter your email and password.");

    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (res.ok) {
        const { slug } = await res.json();
        window.location.href = `/e/${slug}/gallery`;
        return;
      }
      showError(res.status === 401 ? "Wrong email or password." : `Error ${res.status}. Try again.`);
    } catch {
      showError("Network error. Please try again.");
    }
    btn.disabled = false;
    btn.textContent = "Log in";
  }
</script>
</body>
</html>
