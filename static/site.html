<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>__OG_TITLE__</title>
  <meta property="og:title" content="__OG_TITLE__" />
  <meta property="og:description" content="__OG_DESC__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Confetti website invitation (WED-36): one renderer, five designs, the couple's own sections. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--text); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color .8s ease; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .sans { font-family: "Inter", -apple-system, sans-serif; }

    /* ── Palettes ─────────────────────────────────────────────── */
    body[data-theme="linen"]   { --bg: #F6F1E8; --bg2: #EFE7DA; --ink: #2E2620; --soft: #6F6257; --accent: #9C7A4A; --line: rgba(156,122,74,.35); --card: #FBF8F2; --on: #F6F1E8; }
    body[data-theme="garden"]  { --bg: #EEF1E8; --bg2: #E2E8DA; --ink: #22332A; --soft: #5A6B5F; --accent: #5F7F55; --line: rgba(95,127,85,.3); --card: #F8FAF4; --on: #F8FAF4; }
    body[data-theme="noir"]    { --bg: #0B0B0A; --bg2: #151513; --ink: #F1ECE2; --soft: #A69F92; --accent: #C9A45C; --line: rgba(201,164,92,.3); --card: #141412; --on: #0B0B0A; }
    body[data-theme="riviera"] { --bg: #F7F4EE; --bg2: #E8F0F5; --ink: #12324A; --soft: #4F6A7D; --accent: #1F5F8B; --line: rgba(31,95,139,.22); --card: #FFFFFF; --on: #FFFFFF; --sun: #E9A23B; --clay: #C8643B; }
    body[data-theme="bloom"]   { --bg: #F6E6E1; --bg2: #F1D7D1; --ink: #3A1F27; --soft: #7A5560; --accent: #B4536A; --line: rgba(180,83,106,.28); --card: #FBF1EE; --on: #FBF1EE; }

    .progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); z-index: 30; }

    /* ── Hero ─────────────────────────────────────────────────── */
    .hero { position: relative; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 72px 24px; overflow: hidden; isolation: isolate; }
    .hero-in { position: relative; z-index: 3; will-change: transform, opacity; }
    .kicker { font-family: "Inter", sans-serif; font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: var(--accent); }
    .names { font-family: var(--names); font-size: clamp(46px, 13vw, 124px); line-height: 1.1; font-weight: 400; margin: 18px auto 12px; color: var(--ink); max-width: 11em; }
    .names.italic { font-style: italic; }
    .when { font-size: clamp(17px, 3.6vw, 22px); color: var(--soft); letter-spacing: .02em; }
    .cue { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 3; font-family: "Inter", sans-serif; font-size: 11px;
      letter-spacing: .3em; text-transform: uppercase; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .cue i { width: 1px; height: 36px; background: linear-gradient(var(--accent), transparent); animation: cue 2s ease-in-out infinite; transform-origin: top; }
    @keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
    .fade { opacity: 0; transform: translateY(12px); animation: fade 1.1s ease forwards; }
    @keyframes fade { to { opacity: 1; transform: none; } }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    .deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; display: none; }
    body[data-theme="linen"] .deco.linen, body[data-theme="garden"] .deco.garden, body[data-theme="noir"] .deco.noir,
    body[data-theme="riviera"] .deco.riviera, body[data-theme="bloom"] .deco.bloom { display: block; }

    /* Pen writing: a soft mask sweeps across the names. */
    .write { -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
      -webkit-mask-size: 250% 100%; mask-size: 250% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: 100% 0; mask-position: 100% 0; animation: write 2.8s linear .7s forwards; }
    @keyframes write { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }

    /* Linen: double gold frame draws itself; a monogram seal settles in. */
    .deco.linen svg { position: absolute; overflow: visible; }
    .deco.linen .f1 { inset: 20px; width: calc(100% - 40px); height: calc(100% - 40px); }
    .deco.linen .f2 { inset: 28px; width: calc(100% - 56px); height: calc(100% - 56px); }
    .deco.linen rect { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 5000; stroke-dashoffset: 5000; animation: draw 3.6s cubic-bezier(.6,0,.2,1) .1s forwards; }
    .deco.linen .f2 rect { stroke-opacity: .45; animation-delay: .5s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .seal { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--names);
      font-size: 30px; color: var(--accent); border: 1px solid var(--accent); box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--line);
      opacity: 0; transform: scale(1.6); animation: seal 1.2s cubic-bezier(.2,.8,.2,1) .3s forwards; }
    @keyframes seal { to { opacity: 1; transform: none; } }
    body:not([data-theme="linen"]) .seal { display: none; }

    /* Garden: branches grow from the corners; petals drift (canvas). */
    .deco.garden svg { position: absolute; width: min(64vw, 440px); height: auto; will-change: transform; }
    .deco.garden .tl { top: -24px; left: -36px; }
    .deco.garden .br { bottom: -36px; right: -36px; transform: rotate(180deg); }
    .deco.garden .tr { top: 8%; right: -60px; width: min(40vw, 260px); transform: scaleX(-1) rotate(-20deg); opacity: .7; }
    .deco.garden path { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3.2s ease forwards; }
    .deco.garden path.leaf { fill: var(--accent); fill-opacity: 0; animation: draw 2.4s ease forwards, leaf 2.6s ease forwards; }
    @keyframes leaf { 55% { fill-opacity: 0; } to { fill-opacity: .2; } }
    body[data-theme="garden"] .hero { background: radial-gradient(ellipse at 50% 38%, #FBFCF8 0%, var(--bg) 68%); }
    body[data-theme="garden"] .names { filter: blur(14px); opacity: 0; animation: unblur 2.2s ease .6s forwards; }
    @keyframes unblur { to { filter: blur(0); opacity: 1; } }

    /* Noir: gold dust (canvas), shimmering names, light lines open out. */
    body[data-theme="noir"] .names { background: linear-gradient(100deg, #8C6A2E 20%, #F7E3B0 40%, #C9A45C 55%, #8C6A2E 80%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: write 2.8s linear .7s forwards, shine 5s linear 3.5s infinite; }
    @keyframes shine { to { background-position: -250% 0; } }
    .deco.noir i { position: absolute; left: 50%; width: min(84vw, 680px); height: 1px; margin-left: calc(min(84vw, 680px) / -2);
      background: linear-gradient(90deg, transparent, var(--accent), transparent); transform: scaleX(0); animation: ray 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    .deco.noir i:nth-child(1) { top: calc(50% - 140px); animation-delay: .3s; } .deco.noir i:nth-child(2) { top: calc(50% + 140px); animation-delay: .6s; }
    @keyframes ray { to { transform: scaleX(1); } }
    body[data-theme="noir"] .hero { background: radial-gradient(ellipse at 50% 50%, #1A1813 0%, var(--bg) 62%); }

    /* Riviera: the sun rises, waves roll, letters come up like tide. */
    .deco.riviera .sun { position: absolute; left: 50%; bottom: 2%; width: min(70vw, 460px); aspect-ratio: 1; margin-left: calc(min(70vw, 460px) / -2); border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #FBD78B, var(--sun) 62%, rgba(233,162,59,0) 72%); opacity: .55; transform: translateY(40%); animation: rise 3.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { to { transform: translateY(0); opacity: .8; } }
    .deco.riviera svg { position: absolute; left: 0; width: 200%; height: 22%; bottom: 0; }
    .deco.riviera .w1 { animation: wave 9s linear infinite; fill: var(--accent); opacity: .9; }
    .deco.riviera .w2 { animation: wave 14s linear infinite reverse; fill: #5E9CC4; opacity: .55; bottom: 3%; }
    @keyframes wave { to { transform: translateX(-50%); } }
    body[data-theme="riviera"] .hero { background: linear-gradient(180deg, #FDF8EF 0%, #F9E9D2 62%, var(--bg) 100%); }
    .ch { display: inline-block; opacity: 0; transform: translateY(.5em) rotate(4deg); animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; white-space: pre; }
    @keyframes up { to { opacity: 1; transform: none; } }

    /* Bloom: colour drifts and blooms; huge names rise word by word. */
    .deco.bloom b { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .7; animation: drift 16s ease-in-out infinite alternate; }
    .deco.bloom b:nth-child(1) { width: 60vmax; height: 60vmax; left: -20vmax; top: -18vmax; background: #F3B6B9; }
    .deco.bloom b:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: 10vmax; background: #F7D3A6; animation-duration: 19s; }
    .deco.bloom b:nth-child(3) { width: 46vmax; height: 46vmax; left: 10vmax; bottom: -22vmax; background: #D9A6C8; animation-duration: 22s; }
    @keyframes drift { 50% { transform: translate(6vmax, 4vmax) scale(1.12); } 100% { transform: translate(-4vmax, 6vmax) scale(.94); } }
    body[data-theme="bloom"] .names { font-size: clamp(60px, 18vw, 170px); line-height: .98; }
    .word { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .1em; }
    .word > span { display: inline-block; transform: translateY(110%); animation: wordup 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes wordup { to { transform: none; } }
    .marquee { overflow: hidden; border-block: 1px solid var(--line); padding: 14px 0; display: none; }
    body[data-theme="bloom"] .marquee { display: block; }
    .marquee div { display: flex; width: max-content; animation: marquee 22s linear infinite; }
    .marquee span { font-family: var(--names); font-size: 34px; padding-right: 1.2em; color: var(--accent); white-space: nowrap; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* ── Sections ─────────────────────────────────────────────── */
    main { max-width: 700px; margin: 0 auto; padding: 0 24px; }
    .sec { padding: 84px 0; text-align: center; position: relative; }
    .sec + .sec::before { content: ""; position: absolute; top: 0; left: 50%; width: 64px; height: 1px; margin-left: -32px; background: var(--accent); opacity: .6; }
    .sec h2 { font-family: var(--text); font-size: clamp(32px, 6.4vw, 46px); font-weight: 500; line-height: 1.12; margin-bottom: 20px; }
    .sec h2 .l { display: inline-block; opacity: 0; transform: translateY(.4em); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); white-space: pre; }
    .sec.in h2 .l { opacity: 1; transform: none; }
    .sec .body { font-size: clamp(19px, 3.6vw, 22px); line-height: 1.55; max-width: 32em; margin: 0 auto; white-space: pre-line; }
    .sec .body .w { opacity: .18; transition: opacity .3s ease; }
    .sec .body .w.on { opacity: 1; }
    .intro { font-size: clamp(22px, 4.6vw, 30px); line-height: 1.4; font-style: italic; }

    /* Designs change how sections look. */
    body[data-theme="garden"] main { padding: 0 14px; }
    body[data-theme="garden"] .sec { background: var(--card); border-radius: 30px; margin: 18px 0; padding: 64px 26px; box-shadow: 0 14px 40px rgba(34,51,42,.07);
      opacity: 0; transform: translateY(40px) scale(.97); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1); }
    body[data-theme="garden"] .sec.in { opacity: 1; transform: none; }
    body[data-theme="garden"] .sec + .sec::before { display: none; }
    body[data-theme="noir"] .sec h2 { font-size: clamp(20px, 4.4vw, 26px); letter-spacing: .32em; text-transform: uppercase; font-weight: 400; color: var(--accent); }
    body[data-theme="noir"] .sec + .sec::before { width: 1px; height: 64px; margin: -32px 0 0; background: linear-gradient(transparent, var(--accent), transparent); }
    body[data-theme="riviera"] .sec h2 { font-style: italic; color: var(--accent); }
    body[data-theme="riviera"] .sec + .sec::before { width: 120px; margin-left: -60px; height: 10px; background: none;
      background-image: radial-gradient(circle, var(--accent) 1.5px, transparent 2px); background-size: 12px 10px; opacity: .5; }
    body[data-theme="bloom"] .sec h2 { font-family: var(--names); font-size: clamp(44px, 10vw, 72px); font-weight: 400; color: var(--accent); }
    body[data-theme="bloom"] .sec:nth-child(even) { background: var(--bg2); margin: 0 -24px; padding-left: 24px; padding-right: 24px; border-radius: 0; }
    body[data-theme="bloom"] .sec + .sec::before { display: none; }

    /* Schedule: a line that draws as you scroll, stops that light up. */
    .timeline { position: relative; text-align: left; max-width: 460px; margin: 10px auto 0; padding-left: 38px; }
    .timeline::before, .timeline .bar { content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
    .timeline .bar { background: var(--accent); transform-origin: top; transform: scaleY(var(--p, 0)); }
    .ev { position: relative; padding: 0 0 38px; opacity: .35; transition: opacity .6s ease; }
    .ev.on { opacity: 1; }
    .ev:last-child { padding-bottom: 0; }
    .ev::before { content: ""; position: absolute; left: -35px; top: 8px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 1px solid var(--accent); transition: background .5s ease, transform .5s ease; }
    .ev.on::before { background: var(--accent); transform: scale(1.15); }
    .ev .t { font-family: "Inter", sans-serif; font-size: 13px; letter-spacing: .16em; color: var(--accent); font-weight: 500; }
    .ev h3 { font-family: var(--text); font-size: 27px; font-weight: 500; line-height: 1.2; margin: 2px 0; }
    .ev p { color: var(--soft); font-size: 17px; }
    .ev a { font-family: "Inter", sans-serif; font-size: 13px; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }

    .photo { padding: 48px 0; }
    .photo .clip { overflow: hidden; clip-path: inset(18% 12% 18% 12% round 6px); transition: clip-path 1.6s cubic-bezier(.6,0,.2,1); }
    .photo.in .clip { clip-path: inset(0 0 0 0 round 6px); }
    body[data-theme="garden"] .photo .clip { clip-path: inset(18% 12% 18% 12% round 40px); } body[data-theme="garden"] .photo.in .clip { clip-path: inset(0 round 30px); }
    body[data-theme="bloom"] .photo .clip { clip-path: circle(20% at 50% 50%); } body[data-theme="bloom"] .photo.in .clip { clip-path: circle(75% at 50% 50%); }
    .photo img { width: 100%; transform: scale(1.18) translateY(var(--py, 0)); transition: transform 2.2s cubic-bezier(.2,.7,.2,1); }
    .photo.in img { transform: scale(1.04) translateY(var(--py, 0)); }
    body[data-theme="noir"] .photo img { filter: grayscale(1) contrast(1.05); transition: transform 2.2s cubic-bezier(.2,.7,.2,1), filter 2.4s ease .4s; }
    body[data-theme="noir"] .photo.in img { filter: none; }
    .photo figcaption { font-style: italic; color: var(--soft); margin-top: 16px; font-size: 18px; text-align: center; }

    .count { display: flex; justify-content: center; gap: clamp(10px, 4vw, 30px); margin-top: 10px; }
    .count div { min-width: 64px; }
    .count b { display: block; font-family: var(--text); font-size: clamp(42px, 11vw, 70px); font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; overflow: hidden; height: 1.05em; }
    .count b span { display: block; animation: tick .5s cubic-bezier(.2,.8,.2,1); }
    @keyframes tick { from { transform: translateY(-100%); opacity: 0; } }
    .count small { font-family: "Inter", sans-serif; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
    body[data-theme="noir"] .count b { color: var(--accent); font-weight: 400; font-size: clamp(48px, 14vw, 92px); }
    body[data-theme="bloom"] .count b { font-family: var(--names); font-weight: 400; color: var(--accent); }

    .qa { text-align: left; max-width: 540px; margin: 0 auto; border-top: 1px solid var(--line); }
    .qa details { border-bottom: 1px solid var(--line); }
    .qa summary { cursor: pointer; list-style: none; padding: 20px 0; font-size: 21px; display: flex; justify-content: space-between; gap: 16px; }
    .qa summary::-webkit-details-marker { display: none; }
    .qa summary::after { content: "+"; color: var(--accent); transition: transform .3s ease; }
    .qa details[open] summary::after { transform: rotate(45deg); }
    .qa details p { color: var(--soft); padding-bottom: 20px; font-size: 18px; white-space: pre-line; }

    .rv { opacity: 0; transform: translateY(30px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1); }
    .rv.in { opacity: 1; transform: none; }

    /* ── RSVP ─────────────────────────────────────────────────── */
    .rsvp { padding: 96px 0 80px; }
    body[data-theme="riviera"] .rsvp { background: var(--accent); color: #fff; margin: 0 -24px; padding-left: 24px; padding-right: 24px; --soft: rgba(255,255,255,.75); --line: rgba(255,255,255,.35); --card: rgba(255,255,255,.1); }
    body[data-theme="riviera"] .rsvp h2 .l { color: #fff; }
    .form { text-align: left; max-width: 420px; margin: 30px auto 0; display: grid; gap: 18px; font-family: "Inter", sans-serif; }
    .form label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); display: block; margin-bottom: 6px; }
    .form input, .form textarea { width: 100%; font: inherit; font-size: 16px; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
    .form input:focus, .form textarea:focus { border-color: var(--accent); }
    body[data-theme="riviera"] .rsvp .form input:focus { border-color: #fff; }
    .form textarea { min-height: 88px; resize: vertical; }
    .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice button, .step button { font: inherit; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: inherit; border-radius: 12px; padding: 13px 8px; }
    .choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on); }
    body[data-theme="riviera"] .rsvp .choice button[aria-pressed="true"] { background: #fff; color: var(--accent); border-color: #fff; }
    .step { display: flex; align-items: center; gap: 14px; }
    .step button { width: 46px; padding: 10px 0; }
    .step output { font-size: 18px; min-width: 2ch; text-align: center; }
    .send { font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; border: 0; border-radius: 12px; padding: 15px; background: var(--ink); color: var(--bg); }
    body[data-theme="noir"] .send { background: var(--accent); color: #0B0B0A; }
    body[data-theme="riviera"] .rsvp .send { background: var(--sun); color: #12324A; }
    .send:disabled { opacity: .5; }
    .err { color: #C0392B; font-size: 14px; min-height: 1em; }
    .thanks { padding-top: 20px; }
    .thanks h3 { font-family: var(--names); font-size: 44px; font-weight: 400; }
    .thanks p { color: var(--soft); margin-top: 8px; }

    .pill { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 140px);
      transition: transform .5s cubic-bezier(.2,.8,.2,1); font-family: "Inter", sans-serif; font-size: 14px; font-weight: 500; text-decoration: none;
      padding: 13px 28px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    body[data-theme="noir"] .pill { background: var(--accent); color: #0B0B0A; }
    .pill.show { transform: translate(-50%, 0); }

    footer { text-align: center; padding: 44px 24px 100px; font-family: "Inter", sans-serif; font-size: 12px; color: var(--soft); }
    .preview-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: #F4EBE2; color: #2B2420; font: 13px "Inter", sans-serif; text-align: center; padding: 8px 12px; }
    .preview-bar a { color: #9E4F45; font-weight: 600; }
    .missing { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; }
  </style>
</head>
<body data-theme="linen">
<div class="progress" id="progress"></div>
<div class="preview-bar" id="previewBar" hidden>Preview: only you can see this until you add Invitation + RSVP. <a id="previewLink" href="#">Back to the editor</a></div>

<header class="hero" id="hero">
  <div class="deco linen" aria-hidden="true"><svg class="f1"><rect width="100%" height="100%" /></svg><svg class="f2"><rect width="100%" height="100%" /></svg></div>
  <div class="deco garden" aria-hidden="true">
    <svg class="tl" viewBox="0 0 340 260"><path d="M6 254 C 70 190, 150 120, 334 18" /><path d="M120 150 C 150 150, 180 170, 200 200" /><path class="leaf" d="M90 175 c 10 -40 50 -50 60 -48 c -6 30 -30 52 -60 48z" /><path class="leaf" d="M150 128 c -30 -20 -30 -60 -22 -70 c 24 12 34 44 22 70z" /><path class="leaf" d="M205 92 c 12 -36 48 -44 58 -40 c -8 28 -34 46 -58 40z" /><path class="leaf" d="M262 58 c -24 -18 -22 -50 -14 -58 c 20 12 26 38 14 58z" /><path class="leaf" d="M170 182 c 20 -6 34 6 36 20 c -18 4 -32 -4 -36 -20z" /></svg>
    <svg class="tr" viewBox="0 0 340 260"><path d="M6 254 C 70 190, 150 120, 334 18" /><path class="leaf" d="M90 175 c 10 -40 50 -50 60 -48 c -6 30 -30 52 -60 48z" /><path class="leaf" d="M205 92 c 12 -36 48 -44 58 -40 c -8 28 -34 46 -58 40z" /></svg>
    <svg class="br" viewBox="0 0 340 260"><path d="M6 254 C 70 190, 150 120, 334 18" /><path d="M120 150 C 150 150, 180 170, 200 200" /><path class="leaf" d="M90 175 c 10 -40 50 -50 60 -48 c -6 30 -30 52 -60 48z" /><path class="leaf" d="M150 128 c -30 -20 -30 -60 -22 -70 c 24 12 34 44 22 70z" /><path class="leaf" d="M205 92 c 12 -36 48 -44 58 -40 c -8 28 -34 46 -58 40z" /></svg>
  </div>
  <div class="deco noir" aria-hidden="true"><i></i><i></i></div>
  <div class="deco riviera" aria-hidden="true">
    <div class="sun"></div>
    <svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60 Q 75 20 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 V120 H0z" /></svg>
    <svg class="w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 Q 75 35 150 70 T 300 70 T 450 70 T 600 70 T 750 70 T 900 70 T 1050 70 T 1200 70 V120 H0z" /></svg>
  </div>
  <div class="deco bloom" aria-hidden="true"><b></b><b></b><b></b></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="hero-in" id="heroIn">
    <div class="seal" id="seal"></div>
    <div class="kicker fade" style="animation-delay:.3s">We're getting married</div>
    <h1 class="names" id="names"></h1>
    <div class="when fade" id="when" style="animation-delay:2.4s"></div>
  </div>
  <div class="cue fade" style="animation-delay:3.4s" aria-hidden="true">Scroll<i></i></div>
</header>
<div class="marquee" aria-hidden="true"><div id="marquee"></div></div>

<main id="main"></main>

<footer><span id="photos" hidden><a id="photosLink" href="#">Share your photos</a> · </span>Made with <a href="/" target="_blank" rel="noopener">Confetti</a></footer>
<a class="pill" id="pill" href="#rsvp">RSVP</a>
<div class="missing" id="missing" hidden><div><h1 style="font-weight:500">Invitation not found</h1><p style="color:var(--soft)">Check the link you were sent.</p></div></div>

<script src="/static/invite/card.js"></script>
<script src="/static/invite/designs.js"></script>
<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const path = location.pathname.split("/");
  const slug = path[1] === "i" ? path[2] : null;
  const embed = params.has("embed");                                    // live preview inside the editor
  const demoId = path[1] === "demo" ? path[2] : params.get("demo");     // sample couple, any design
  const loop = params.has("loop");                                       // landing page phones: replay forever
  const THEMES = ["linen", "garden", "noir", "riviera", "bloom"];
  const fmtDate = (d, o) => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB", o) : "";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const link = document.createElement("link"); link.rel = "stylesheet"; link.href = ConfettiCard.FONT_CSS; document.head.appendChild(link);

  let inv = null, revealer = null, timer = null, first = true;

  // ── Render ──────────────────────────────────────────────────
  function render(data) {
    inv = data;
    const theme = THEMES.includes(inv.theme) ? inv.theme : "linen";
    const font = ConfettiCard.FONTS[inv.font] || ConfettiCard.FONTS.classic;
    document.body.dataset.theme = theme;
    document.body.style.setProperty("--names", font.names);
    document.body.style.setProperty("--text", font.text);
    if (!inv.demo) document.title = `${inv.names} · You're invited`;
    renderNames(theme, font);
    const initials = (inv.names || "").split(/\s*(?:&|and|\+)\s*/i).map((n) => n.trim()[0]).filter(Boolean).slice(0, 2);
    $("seal").textContent = initials.join("");
    $("when").textContent = [fmtDate(inv.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" }), inv.time].filter(Boolean).join(" · ");
    const mq = [inv.names, fmtDate(inv.date, { day: "numeric", month: "long", year: "numeric" })].filter(Boolean).join(" · ");
    $("marquee").innerHTML = "";
    for (let i = 0; i < 8; i++) $("marquee").append(el("span", null, mq + " ·"));

    const main = $("main"); main.innerHTML = "";
    if (inv.message) { const s = el("section", "sec"); s.append(el("p", "intro", inv.message)); main.append(s); }
    const secs = (inv.sections || []).filter(hasContent);
    for (let i = 0; i < secs.length; i++) {
      const s = secs[i];
      if (s.type === "event" || s.type === "qa") {
        const group = [];
        while (i < secs.length && secs[i].type === s.type) group.push(secs[i++]);
        i--;
        main.append(s.type === "event" ? schedule(group) : questions(group));
      } else if (s.type === "text") {
        const sec = el("section", "sec");
        if (s.title) sec.append(heading(s.title));
        sec.append(words(s.body));
        main.append(sec);
      } else if (s.type === "photo") {
        const fig = el("figure", "photo sec"); const clip = el("div", "clip"); const img = el("img");
        img.src = s.url; img.alt = s.caption || ""; img.loading = "lazy"; clip.append(img); fig.append(clip);
        if (s.caption) fig.append(el("figcaption", null, s.caption));
        main.append(fig);
      } else if (s.type === "countdown") {
        const sec = el("section", "sec"); sec.append(heading(s.title || "Counting down"));
        const c = el("div", "count"); c.id = "count";
        for (const u of ["Days", "Hours", "Minutes", "Seconds"]) { const d = el("div"); d.append(el("b"), el("small", null, u)); c.append(d); }
        sec.append(c); main.append(sec);
      }
    }
    main.append(rsvpSection());
    tick(); clearInterval(timer); timer = setInterval(tick, 1000);
    $("photos").hidden = !(inv.upload_url && inv.date && Date.now() >= new Date(inv.date + "T00:00:00").getTime());
    if (inv.upload_url) $("photosLink").href = inv.upload_url;

    if (revealer) revealer.disconnect();
    revealer = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revealer.unobserve(e.target); } }),
      { rootMargin: "0px 0px -14% 0px" });
    document.querySelectorAll(".sec, .rv").forEach((n) => (embed && !first) ? n.classList.add("in") : revealer.observe(n));
    if (embed && !first) skipIntro();
    startFx(theme);
    first = false;
    onScroll();
  }

  function hasContent(s) {
    if (s.type === "text") return !!(s.body || "").trim();
    if (s.type === "event") return !!(s.title || "").trim();
    if (s.type === "photo") return !!s.url;
    if (s.type === "qa") return !!((s.question || "").trim() && (s.answer || "").trim());
    if (s.type === "countdown") return !!inv.date;
    return false;
  }

  function renderNames(theme, font) {
    const n = $("names"); n.innerHTML = ""; n.className = "names" + (font.italic ? " italic" : "");
    const text = inv.names || "";
    if (theme === "riviera") {
      [...text].forEach((c, i) => { const s = el("span", "ch", c); s.style.animationDelay = (0.5 + i * 0.06) + "s"; n.append(s); });
    } else if (theme === "bloom") {
      text.split(/\s+/).forEach((w, i) => { const o = el("span", "word"); const s = el("span", null, w); s.style.animationDelay = (0.3 + i * 0.22) + "s"; o.append(s); n.append(o, " "); });
    } else {
      n.textContent = text;
      if (theme !== "garden") n.classList.add("write");
    }
  }

  function heading(text) {
    const h = el("h2");
    [...text].forEach((c, i) => { const s = el("span", "l", c); s.style.transitionDelay = (i * 0.035) + "s"; h.append(s); });
    return h;
  }
  function words(text) {
    const p = el("p", "body");
    (text || "").split(/(\s+)/).forEach((w) => p.append(/\s+/.test(w) ? document.createTextNode(w) : el("span", "w", w)));
    return p;
  }

  function schedule(group) {
    const sec = el("section", "sec"); sec.append(heading("The day"));
    const tl = el("div", "timeline"); tl.append(el("div", "bar"));
    for (const e of group) {
      const ev = el("div", "ev");
      if (e.time) ev.append(el("div", "t", e.time));
      ev.append(el("h3", null, e.title || ""));
      if (e.place) ev.append(el("p", null, e.place));
      if (e.map_url) { const a = el("a", null, "Map"); a.href = e.map_url; a.target = "_blank"; a.rel = "noopener"; ev.append(a); }
      tl.append(ev);
    }
    sec.append(tl); return sec;
  }
  function questions(group) {
    const sec = el("section", "sec"); sec.append(heading("Good to know"));
    const box = el("div", "qa");
    for (const q of group) { const d = el("details"); d.append(el("summary", null, q.question), el("p", null, q.answer)); box.append(d); }
    sec.append(box); return sec;
  }

  let lastDigits = [];
  function tick() {
    const c = $("count"); if (!c || !inv || !inv.date) return;
    let ms = Math.max(0, new Date(`${inv.date}T${inv.time || "12:00"}:00`).getTime() - Date.now());
    const parts = [86400000, 3600000, 60000, 1000].map((u) => { const v = Math.floor(ms / u); ms -= v * u; return v; });
    c.querySelectorAll("b").forEach((b, i) => {
      const v = String(parts[i]).padStart(i ? 2 : 1, "0");
      if (lastDigits[i] !== v || !b.firstChild) { b.innerHTML = ""; b.append(el("span", null, v)); }
      lastDigits[i] = v;
    });
  }

  // ── RSVP ────────────────────────────────────────────────────
  function rsvpSection() {
    const sec = el("section", "sec rsvp"); sec.id = "rsvp";
    sec.append(heading("Will you join us?"));
    if (inv.rsvp_by) sec.append(el("p", "sans", "Kindly reply by " + fmtDate(inv.rsvp_by, { day: "numeric", month: "long" })));
    const form = el("form", "form"); form.noValidate = true;
    form.innerHTML = `
      <div><label for="gName">Your name</label><input id="gName" autocomplete="name" maxlength="120" /></div>
      <div class="choice" role="group" aria-label="Will you attend?"><button type="button" data-a="1" aria-pressed="false">Joyfully accept</button><button type="button" data-a="0" aria-pressed="false">Regretfully decline</button></div>
      <div id="peopleBox" hidden><label>How many of you, including you?</label><div class="step"><button type="button" data-d="-1" aria-label="Fewer">−</button><output id="people">1</output><button type="button" data-d="1" aria-label="More">+</button></div></div>
      <div><label for="gNote">Dietary needs or a message</label><textarea id="gNote" maxlength="600"></textarea></div>
      <button class="send" type="submit">Send reply</button>
      <div class="err" id="err" role="alert"></div>`;
    let attending = null, people = 1;
    form.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      attending = b.dataset.a === "1";
      form.querySelectorAll("[data-a]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      form.querySelector("#peopleBox").hidden = !attending;
    });
    form.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { people = Math.min(20, Math.max(1, people + Number(b.dataset.d))); form.querySelector("#people").textContent = people; });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const err = form.querySelector("#err"); err.textContent = "";
      const name = form.querySelector("#gName").value.trim();
      if (!name) return void (err.textContent = "Please add your name.");
      if (attending === null) return void (err.textContent = "Please choose accept or decline.");
      const done = () => {
        const t = el("div", "thanks");
        t.append(el("h3", null, attending ? `See you there, ${name.split(" ")[0]}!` : `Thank you, ${name.split(" ")[0]}`),
                 el("p", "sans", (attending ? "Your reply has been sent." : "We'll miss you. Your reply has been sent.") + (inv.preview ? " (Preview: not saved.)" : "")));
        form.replaceWith(t);
      };
      if (inv.preview || !slug) return done();
      const btn = form.querySelector(".send"); btn.disabled = true;
      try {
        const r = await fetch(`/api/i/${encodeURIComponent(slug)}/rsvp`, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, attending, guests: people, note: form.querySelector("#gNote").value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail[0].msg.replace(/^Value error, /, "") : d.detail);
        done();
      } catch (ex) { err.textContent = ex.message || "Couldn't send your reply. Please try again."; btn.disabled = false; }
    };
    sec.append(form); return sec;
  }

  // ── Particles: petals (Garden), gold dust (Noir), soft light (Bloom) ──
  let fxRun = 0;
  function startFx(theme) {
    const run = ++fxRun;
    const cv = $("fx"), ctx = cv.getContext("2d");
    const mode = { garden: "petals", noir: "dust", bloom: "bokeh" }[theme];
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!mode) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const size = () => { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; };
    size(); addEventListener("resize", size);
    const N = mode === "dust" ? 70 : mode === "petals" ? 22 : 16;
    const P = Array.from({ length: N }, () => spawn(true));
    function spawn(any) {
      const w = cv.width, h = cv.height;
      return { x: Math.random() * w, y: any ? Math.random() * h : (mode === "petals" ? -20 : h + 20), r: (mode === "bokeh" ? 18 + Math.random() * 40 : mode === "petals" ? 5 + Math.random() * 6 : 0.6 + Math.random() * 1.8) * dpr,
               vx: (Math.random() - .5) * .3 * dpr, vy: (mode === "petals" ? .4 + Math.random() * .6 : -(.15 + Math.random() * .45)) * dpr,
               a: Math.random() * Math.PI * 2, s: .01 + Math.random() * .02, o: .3 + Math.random() * .6 };
    }
    let last = performance.now();
    (function frame(now) {
      if (run !== fxRun) return;
      const dt = Math.min(3, (now - last) / 16.7); last = now;
      if ($("hero").getBoundingClientRect().bottom > 0) {
        ctx.clearRect(0, 0, cv.width, cv.height);
        for (let i = 0; i < P.length; i++) {
          const p = P[i]; p.a += p.s * dt; p.x += (p.vx + Math.sin(p.a) * (mode === "petals" ? .6 : .2) * dpr) * dt; p.y += p.vy * dt;
          if (p.y > cv.height + 30 || p.y < -30) P[i] = spawn(false);
          ctx.globalAlpha = p.o * (mode === "dust" ? (.5 + .5 * Math.sin(p.a * 3)) : 1);
          if (mode === "petals") {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = i % 3 ? "#F2C9C7" : "#FFFFFF";
            ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
          } else if (mode === "dust") {
            ctx.fillStyle = "#E7C77E"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          } else {
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      requestAnimationFrame(frame);
    })(last);
  }

  // ── Scroll effects ──────────────────────────────────────────
  function progressOf(n) { const r = n.getBoundingClientRect(); return Math.min(1, Math.max(0, (innerHeight * .85 - r.top) / (r.height + innerHeight * .35))); }
  function onScroll() {
    const max = document.documentElement.scrollHeight - innerHeight;
    $("progress").style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
    const h = $("hero").offsetHeight, k = Math.min(1, scrollY / h);
    $("heroIn").style.transform = `translateY(${scrollY * .35}px) scale(${1 - k * .06})`;
    $("heroIn").style.opacity = String(Math.max(0, 1 - k * 1.25));
    document.querySelectorAll(".deco.garden svg").forEach((s, i) => { s.style.translate = `0 ${scrollY * (i % 2 ? -0.18 : 0.22)}px`; });
    // Words light up as you read; the schedule line draws; photos drift.
    document.querySelectorAll(".body").forEach((p) => {
      const ws = p.querySelectorAll(".w"), on = Math.round(progressOf(p) * 1.6 * ws.length);
      ws.forEach((w, i) => w.classList.toggle("on", i < on));
    });
    document.querySelectorAll(".timeline").forEach((t) => {
      const pr = progressOf(t); t.style.setProperty("--p", pr.toFixed(3));
      const evs = t.querySelectorAll(".ev"); evs.forEach((e, i) => e.classList.toggle("on", pr >= i / Math.max(1, evs.length) - .02));
    });
    document.querySelectorAll(".photo img").forEach((img) => { const r = img.getBoundingClientRect(); img.style.setProperty("--py", `${((r.top + r.height / 2) / innerHeight - .5) * -24}px`); });
    const rsvp = $("rsvp"), near = rsvp && rsvp.getBoundingClientRect().top < innerHeight;
    $("pill").classList.toggle("show", scrollY > h * .6 && !near);
  }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);

  // ── Auto-scroll: starts after the opening; any touch, wheel or key hands control back ──
  let auto = false, pos = 0, lastT = 0;
  const SPEED = 46; // px per second
  function stopAuto() { auto = false; }
  ["wheel", "touchstart", "pointerdown", "keydown"].forEach((t) => addEventListener(t, stopAuto, { passive: true }));
  function startAuto(delay) {
    setTimeout(() => {
      if (!loop && (scrollY > 40)) return;  // they already started reading
      auto = true; pos = scrollY; lastT = performance.now(); requestAnimationFrame(step);
    }, delay);
  }
  function step(now) {
    if (!auto) return;
    const dt = (now - lastT) / 1000; lastT = now;
    pos += SPEED * Math.min(dt, .1);
    const rsvp = $("rsvp"), end = document.documentElement.scrollHeight - innerHeight;
    if (!loop && rsvp && rsvp.getBoundingClientRect().top < innerHeight * .2) { auto = false; return; }  // stop at RSVP
    if (pos >= end) {
      if (!loop) { auto = false; return; }
      auto = false;
      setTimeout(() => { scrollTo({ top: 0, behavior: "instant" }); replayIntro(); startAuto(4200); }, 1800);
      return;
    }
    scrollTo({ top: pos, behavior: "instant" });
    requestAnimationFrame(step);
  }
  function skipIntro() {
    document.querySelectorAll(".write, .fade, .deco rect, .deco path, .deco i, .deco .sun, .ch, .word > span, .seal, .names").forEach((n) => {
      n.style.animation = "none"; n.style.opacity = 1; n.style.transform = "none"; n.style.filter = "none"; n.style.strokeDashoffset = 0;
      n.style.webkitMaskPosition = "0 0"; n.style.maskPosition = "0 0";
    });
  }
  function replayIntro() {
    const h = $("hero"); const clone = h.cloneNode(true); h.replaceWith(clone);
    document.querySelectorAll(".sec").forEach((s) => { s.classList.remove("in"); revealer.observe(s); });
    startFx(document.body.dataset.theme);
  }

  // ── Load ────────────────────────────────────────────────────
  if (embed) {
    addEventListener("message", (e) => {
      if (e.origin !== location.origin || !e.data || e.data.type !== "confetti-preview") return;
      const replay = e.data.replay; if (replay) first = true;
      render(e.data.inv);
      if (replay) { scrollTo({ top: 0, behavior: "instant" }); startAuto(3600); }
    });
    parent.postMessage({ type: "confetti-preview-ready" }, location.origin);
  } else if (demoId) {
    const d = ConfettiDesigns.demo(THEMES.includes(demoId) ? demoId : "linen");
    if (params.has("blank")) { d.names = ""; d.date = ""; d.time = ""; }   // link-preview images
    render(d);
    if (!params.has("still")) startAuto(3800);
  } else {
    fetch(`/api/i/${encodeURIComponent(slug)}`).then((r) => r.ok ? r.json() : Promise.reject()).then((data) => {
      render(data); startAuto(3800);
      if (data.preview) { $("previewBar").hidden = false; $("previewLink").href = `/e/${slug}/invite`; }
    }).catch(() => { document.querySelectorAll("header, main, footer, .pill, .marquee").forEach((n) => n.hidden = true); $("missing").hidden = false; });
  }
})();
</script>
</body>
</html>
