<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>__OG_TITLE__</title>
  <meta property="og:title" content="__OG_TITLE__" />
  <meta property="og:description" content="__OG_DESC__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Confetti website invitation (WED-36): one page, three designs, the couple's own sections. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { font-family: var(--text); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    /* ── Designs ─────────────────────────────────────────────── */
    body[data-theme="linen"]  { --bg: #F6F1E8; --bg2: #EFE7DA; --ink: #2E2620; --soft: #6F6257; --accent: #9C7A4A; --line: rgba(156,122,74,.35); --card: #FBF8F2; }
    body[data-theme="garden"] { --bg: #EEF1E8; --bg2: #E2E8DA; --ink: #22332A; --soft: #5A6B5F; --accent: #5F7F55; --line: rgba(95,127,85,.35); --card: #F7F9F3; }
    body[data-theme="noir"]   { --bg: #0D0D0C; --bg2: #161614; --ink: #F1ECE2; --soft: #A69F92; --accent: #C9A45C; --line: rgba(201,164,92,.35); --card: #141412; }

    .progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); z-index: 30; }

    /* ── Hero ─────────────────────────────────────────────────── */
    .hero { position: relative; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 72px 24px; overflow: hidden; }
    .hero-in { position: relative; z-index: 2; will-change: transform, opacity; }
    .kicker { font-family: "Inter", sans-serif; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); }
    .names { font-family: var(--names); font-size: clamp(46px, 13vw, 120px); line-height: 1.12; font-weight: 400; margin: 18px 0 10px; color: var(--ink); max-width: 11em; }
    .names.italic { font-style: italic; }
    .when { font-size: clamp(17px, 3.6vw, 22px); color: var(--soft); letter-spacing: .02em; }
    .cue { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 2; font-family: "Inter", sans-serif; font-size: 11px;
      letter-spacing: .3em; text-transform: uppercase; color: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .cue i { width: 1px; height: 36px; background: linear-gradient(var(--accent), transparent); animation: cue 2s ease-in-out infinite; transform-origin: top; }
    @keyframes cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

    /* Pen writing (all designs): a soft mask sweeps across the names. */
    .write { -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
      -webkit-mask-size: 250% 100%; mask-size: 250% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: 100% 0; mask-position: 100% 0; animation: write 2.8s linear .6s forwards; }
    @keyframes write { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
    .fade { opacity: 0; transform: translateY(10px); animation: fade 1.1s ease forwards; }
    @keyframes fade { to { opacity: 1; transform: none; } }

    /* Linen: a gold frame draws itself around the hero. */
    .frame { position: absolute; inset: 22px; z-index: 1; pointer-events: none; }
    .frame { width: calc(100% - 44px); height: calc(100% - 44px); overflow: visible; }
    .frame.inner { inset: 30px; width: calc(100% - 60px); height: calc(100% - 60px); }
    .frame rect { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4000; stroke-dashoffset: 4000; animation: draw 3.4s ease .2s forwards; }
    .frame.inner rect { stroke-opacity: .45; animation-delay: .6s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    body:not([data-theme="linen"]) .frame { display: none; }

    /* Garden: branches grow in the corners and drift as you scroll. */
    .leaves { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .leaves svg { position: absolute; width: min(46vw, 340px); height: auto; will-change: transform; }
    .leaves .tl { top: -20px; left: -30px; }
    .leaves .br { bottom: -30px; right: -30px; transform: rotate(180deg); }
    .leaves path { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 3s ease forwards; }
    .leaves path.leaf { fill: var(--accent); fill-opacity: 0; animation: draw 2.4s ease forwards, leaf 1.6s ease forwards; }
    @keyframes leaf { 60% { fill-opacity: 0; } to { fill-opacity: .18; } }
    body:not([data-theme="garden"]) .leaves { display: none; }

    /* Noir: names shimmer in gold, fine lines open out from the centre. */
    body[data-theme="noir"] .names { background: linear-gradient(100deg, #8C6A2E 20%, #F3DCA4 40%, #C9A45C 55%, #8C6A2E 80%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: write 2.8s linear .6s forwards, shine 6s linear 3.4s infinite; }
    @keyframes shine { to { background-position: -250% 0; } }
    .rays { position: absolute; left: 50%; top: 50%; width: min(80vw, 640px); height: 1px; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; }
    .rays i { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); transform: scaleX(0); animation: ray 2.2s ease forwards; }
    .rays i:nth-child(1) { top: -120px; animation-delay: .4s; } .rays i:nth-child(2) { top: 120px; animation-delay: .7s; }
    @keyframes ray { to { transform: scaleX(1); } }
    body:not([data-theme="noir"]) .rays { display: none; }

    /* ── Sections ─────────────────────────────────────────────── */
    main { max-width: 680px; margin: 0 auto; padding: 0 24px; }
    .sec { padding: 72px 0; text-align: center; }
    .sec + .sec { border-top: 1px solid var(--line); }
    .sec h2 { font-family: var(--text); font-size: clamp(30px, 6vw, 42px); font-weight: 500; line-height: 1.15; margin-bottom: 18px; }
    .sec .body { font-size: 19px; color: var(--soft); white-space: pre-line; max-width: 34em; margin: 0 auto; }
    .intro { font-size: clamp(20px, 4vw, 24px); font-style: italic; color: var(--soft); }
    .orn { width: 64px; height: 1px; margin: 0 auto 28px; background: var(--accent); }

    /* Schedule: a line that draws as you scroll, dots that pop. */
    .timeline { position: relative; text-align: left; max-width: 460px; margin: 8px auto 0; padding-left: 34px; }
    .timeline::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
    .timeline .bar { position: absolute; left: 8px; top: 8px; width: 1px; height: calc(100% - 16px); background: var(--accent); transform-origin: top; transform: scaleY(0); transition: transform 1.6s ease; }
    .timeline.in .bar { transform: scaleY(1); }
    .ev { position: relative; padding: 0 0 34px; }
    .ev:last-child { padding-bottom: 0; }
    .ev::before { content: ""; position: absolute; left: -31px; top: 9px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1px solid var(--accent); transform: scale(0); transition: transform .5s ease; }
    .timeline.in .ev::before { transform: scale(1); }
    .ev .t { font-family: "Inter", sans-serif; font-size: 13px; letter-spacing: .14em; color: var(--accent); }
    .ev h3 { font-family: var(--text); font-size: 26px; font-weight: 500; line-height: 1.2; margin: 2px 0; }
    .ev p { color: var(--soft); font-size: 17px; }
    .ev a { font-family: "Inter", sans-serif; font-size: 13px; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }

    .photo { padding: 40px 0; }
    .photo .frame-img { overflow: hidden; border-radius: 4px; }
    body[data-theme="garden"] .photo .frame-img { border-radius: 28px; }
    .photo img { width: 100%; transform: scale(1.12); transition: transform 2.4s cubic-bezier(.2,.7,.2,1), filter 2.4s ease; }
    body[data-theme="noir"] .photo img { filter: grayscale(1); }
    .photo.in img { transform: scale(1); filter: none; }
    .photo figcaption { font-style: italic; color: var(--soft); margin-top: 14px; font-size: 17px; }

    .count { display: flex; justify-content: center; gap: clamp(10px, 4vw, 28px); margin-top: 8px; }
    .count div { min-width: 64px; }
    .count b { display: block; font-family: var(--text); font-size: clamp(40px, 10vw, 64px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
    .count span { font-family: "Inter", sans-serif; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--soft); }

    .qa { text-align: left; max-width: 520px; margin: 0 auto; border-top: 1px solid var(--line); }
    .qa details { border-bottom: 1px solid var(--line); }
    .qa summary { cursor: pointer; list-style: none; padding: 18px 0; font-size: 20px; display: flex; justify-content: space-between; gap: 16px; }
    .qa summary::-webkit-details-marker { display: none; }
    .qa summary::after { content: "+"; color: var(--accent); transition: transform .2s; }
    .qa details[open] summary::after { transform: rotate(45deg); }
    .qa details p { color: var(--soft); padding-bottom: 18px; font-size: 17px; white-space: pre-line; }

    /* Garden: soft rounded cards on a sage wash. */
    body[data-theme="garden"] .hero { background: radial-gradient(ellipse at 50% 35%, #F7F9F3 0%, var(--bg) 70%); }
    body[data-theme="garden"] .leaves svg { width: min(62vw, 420px); }
    body[data-theme="garden"] main { padding: 0 16px; }
    body[data-theme="garden"] .sec { background: var(--card); border-radius: 28px; margin: 16px 0; padding: 56px 24px; border: 0; box-shadow: 0 10px 30px rgba(34,51,42,.06); }
    body[data-theme="garden"] .sec + .sec { border-top: 0; }
    body[data-theme="garden"] .orn { width: 8px; height: 8px; border-radius: 50%; }

    /* Noir: tall caps headings, gold numbers, wide rules. */
    body[data-theme="noir"] .sec h2 { font-size: clamp(22px, 4.6vw, 28px); letter-spacing: .28em; text-transform: uppercase; font-weight: 400; }
    body[data-theme="noir"] .count b, body[data-theme="noir"] .ev .t { color: var(--accent); }
    body[data-theme="noir"] .count b { font-size: clamp(48px, 13vw, 84px); font-weight: 400; }
    body[data-theme="noir"] .orn { width: 120px; }
    body[data-theme="noir"] .send { background: var(--accent); color: #0D0D0C; }

    /* Scroll reveal */
    .rv { opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1s ease; }
    .rv.in { opacity: 1; transform: none; }
    body[data-theme="garden"] .rv.from-l { transform: translateX(-36px); }
    body[data-theme="garden"] .rv.from-r { transform: translateX(36px); }
    body[data-theme="garden"] .rv.in { transform: none; }

    /* ── RSVP ─────────────────────────────────────────────────── */
    .rsvp { padding: 88px 0 72px; }
    .form { text-align: left; max-width: 420px; margin: 28px auto 0; display: grid; gap: 18px; font-family: "Inter", sans-serif; }
    .form label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); display: block; margin-bottom: 6px; }
    .form input, .form textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; outline: none; }
    .form input:focus, .form textarea:focus { border-color: var(--accent); }
    .form textarea { min-height: 84px; resize: vertical; }
    .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice button, .step button { font: inherit; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px 8px; }
    .choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--bg); }
    .step { display: flex; align-items: center; gap: 14px; }
    .step button { width: 44px; padding: 10px 0; }
    .step output { font-size: 18px; min-width: 2ch; text-align: center; }
    .send { font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; border: 0; border-radius: 10px; padding: 14px; background: var(--ink); color: var(--bg); }
    .send:disabled { opacity: .5; }
    .err { color: #B3392C; font-size: 14px; min-height: 1em; }
    .thanks h3 { font-family: var(--text); font-size: 34px; font-weight: 500; }
    .thanks p { color: var(--soft); margin-top: 8px; }

    .pill { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 120px);
      transition: transform .4s ease; font-family: "Inter", sans-serif; font-size: 14px; font-weight: 500; text-decoration: none;
      padding: 12px 26px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
    .pill.show { transform: translate(-50%, 0); }

    footer { text-align: center; padding: 40px 24px 96px; font-family: "Inter", sans-serif; font-size: 12px; color: var(--soft); }
    footer a { color: var(--soft); }
    .preview-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: #F4EBE2; color: #2B2420; font: 13px "Inter", sans-serif; text-align: center; padding: 8px 12px; }
    .preview-bar a { color: #9E4F45; font-weight: 600; }
    .missing { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; }
  </style>
</head>
<body data-theme="linen">
<div class="progress" id="progress"></div>
<div class="preview-bar" id="previewBar" hidden>Preview: only you can see this until you add Invitation + RSVP. <a id="previewLink" href="#">Back to the editor</a></div>

<header class="hero" id="hero">
  <svg class="frame" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" /></svg>
  <svg class="frame inner" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" /></svg>
  <div class="leaves" aria-hidden="true">
    <svg class="tl" viewBox="0 0 340 260"><path d="M10 250 C 80 180, 140 120, 330 20" /><path class="leaf" d="M90 175 c 10 -40 50 -50 60 -48 c -6 30 -30 52 -60 48z" /><path class="leaf" d="M150 128 c -30 -20 -30 -60 -22 -70 c 24 12 34 44 22 70z" /><path class="leaf" d="M205 92 c 12 -36 48 -44 58 -40 c -8 28 -34 46 -58 40z" /><path class="leaf" d="M262 58 c -24 -18 -22 -50 -14 -58 c 20 12 26 38 14 58z" /></svg>
    <svg class="br" viewBox="0 0 340 260"><path d="M10 250 C 80 180, 140 120, 330 20" /><path class="leaf" d="M90 175 c 10 -40 50 -50 60 -48 c -6 30 -30 52 -60 48z" /><path class="leaf" d="M150 128 c -30 -20 -30 -60 -22 -70 c 24 12 34 44 22 70z" /><path class="leaf" d="M205 92 c 12 -36 48 -44 58 -40 c -8 28 -34 46 -58 40z" /></svg>
  </div>
  <div class="rays" aria-hidden="true"><i></i><i></i></div>
  <div class="hero-in" id="heroIn">
    <div class="kicker fade" style="animation-delay:.2s">We're getting married</div>
    <h1 class="names write" id="names"></h1>
    <div class="when fade" id="when" style="animation-delay:2.6s"></div>
  </div>
  <div class="cue fade" style="animation-delay:3.4s" aria-hidden="true">Scroll<i></i></div>
</header>

<main id="main"></main>

<footer><span id="photos" hidden><a id="photosLink" href="#">Share your photos</a> · </span>Made with <a href="/" target="_blank" rel="noopener">Confetti</a></footer>
<a class="pill" id="pill" href="#rsvp">RSVP</a>
<div class="missing" id="missing" hidden><div><h1 style="font-family:var(--text);font-weight:500">Invitation not found</h1><p style="color:var(--soft)">Check the link you were sent.</p></div></div>

<script src="/static/invite/card.js"></script>
<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const slug = location.pathname.split("/")[2];
  const embed = new URLSearchParams(location.search).has("embed");  // live preview inside the editor
  const fmtDate = (d, opts) => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB", opts) : "";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Fonts come from the shared card fonts (names + text pair).
  const link = document.createElement("link"); link.rel = "stylesheet"; link.href = ConfettiCard.FONT_CSS; document.head.appendChild(link);

  let inv = null, revealer = null, timer = null, first = true;

  function render(data) {
    inv = data;
    const font = ConfettiCard.FONTS[inv.font] || ConfettiCard.FONTS.classic;
    document.body.dataset.theme = ["linen", "garden", "noir"].includes(inv.theme) ? inv.theme : "linen";
    document.body.style.setProperty("--names", font.names);
    document.body.style.setProperty("--text", font.text);
    document.title = `${inv.names} · You're invited`;
    $("names").textContent = inv.names || "";
    $("names").classList.toggle("italic", !!font.italic);
    $("when").textContent = [fmtDate(inv.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" }), inv.time].filter(Boolean).join(" · ");

    const main = $("main");
    main.innerHTML = "";
    if (inv.message) {
      const s = el("section", "sec rv");
      s.append(el("div", "orn"), el("p", "intro", inv.message));
      main.append(s);
    }
    // Consecutive events become one schedule; consecutive Q&As one list.
    const secs = inv.sections || [];
    let side = 0;
    for (let i = 0; i < secs.length; i++) {
      const s = secs[i];
      if (s.type === "event") {
        const group = [];
        while (i < secs.length && secs[i].type === "event") group.push(secs[i++]);
        i--;
        main.append(schedule(group));
      } else if (s.type === "qa") {
        const group = [];
        while (i < secs.length && secs[i].type === "qa") group.push(secs[i++]);
        i--;
        main.append(questions(group));
      } else if (s.type === "text") {
        const sec = el("section", "sec rv " + (side++ % 2 ? "from-r" : "from-l"));
        if (s.title) sec.append(el("h2", null, s.title));
        if (s.body) sec.append(el("p", "body", s.body));
        main.append(sec);
      } else if (s.type === "photo" && s.url) {
        const fig = el("figure", "photo rv");
        const box = el("div", "frame-img"); const img = el("img"); img.src = s.url; img.alt = s.caption || ""; img.loading = "lazy";
        box.append(img); fig.append(box);
        if (s.caption) fig.append(el("figcaption", null, s.caption));
        main.append(fig);
      } else if (s.type === "countdown" && inv.date) {
        const sec = el("section", "sec rv");
        sec.append(el("h2", null, s.title || "Counting down"));
        const c = el("div", "count"); c.dataset.count = "1";
        for (const u of ["Days", "Hours", "Minutes", "Seconds"]) { const d = el("div"); d.append(el("b", null, "0"), el("span", null, u)); c.append(d); }
        sec.append(c);
        main.append(sec);
      }
    }
    main.append(rsvpSection());
    tick(); clearInterval(timer); timer = setInterval(tick, 1000);

    $("photos").hidden = !(inv.upload_url && inv.date && Date.now() >= new Date(inv.date + "T00:00:00").getTime());
    if (inv.upload_url) $("photosLink").href = inv.upload_url;

    // Reveal on scroll. In the live preview, later edits appear without replaying.
    if (revealer) revealer.disconnect();
    revealer = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revealer.unobserve(e.target); } }),
      { rootMargin: "0px 0px -12% 0px" });
    document.querySelectorAll(".rv, .timeline").forEach((n) => (embed && !first) ? n.classList.add("in") : revealer.observe(n));
    if (embed && !first) document.querySelectorAll(".write, .fade, .frame rect, .leaves path, .rays i").forEach((n) => { n.style.animation = "none"; n.style.opacity = 1; n.style.transform = "none"; n.style.strokeDashoffset = 0; n.style.webkitMaskPosition = "0 0"; n.style.maskPosition = "0 0"; });
    first = false;
  }

  function schedule(group) {
    const sec = el("section", "sec rv");
    sec.append(el("h2", null, "The day"));
    const tl = el("div", "timeline"); tl.append(el("div", "bar"));
    for (const e of group) {
      const ev = el("div", "ev");
      if (e.time) ev.append(el("div", "t", e.time));
      ev.append(el("h3", null, e.title || ""));
      if (e.place) ev.append(el("p", null, e.place));
      if (e.map_url) { const a = el("a", null, "Map"); a.href = e.map_url; a.target = "_blank"; a.rel = "noopener"; ev.append(a); }
      tl.append(ev);
    }
    sec.append(tl);
    return sec;
  }

  function questions(group) {
    const sec = el("section", "sec rv");
    sec.append(el("h2", null, "Good to know"));
    const box = el("div", "qa");
    for (const q of group) {
      const d = el("details"); d.append(el("summary", null, q.question || ""), el("p", null, q.answer || "")); box.append(d);
    }
    sec.append(box);
    return sec;
  }

  function tick() {
    const c = document.querySelector("[data-count]");
    if (!c || !inv || !inv.date) return;
    const target = new Date(`${inv.date}T${inv.time || "12:00"}:00`).getTime();
    let ms = Math.max(0, target - Date.now());
    const parts = [86400000, 3600000, 60000, 1000].map((u) => { const v = Math.floor(ms / u); ms -= v * u; return v; });
    c.querySelectorAll("b").forEach((b, i) => { b.textContent = String(parts[i]).padStart(i ? 2 : 1, "0"); });
  }

  // ── RSVP ─────────────────────────────────────────────────────
  function rsvpSection() {
    const sec = el("section", "sec rsvp rv"); sec.id = "rsvp";
    sec.append(el("h2", null, "Will you join us?"));
    if (inv.rsvp_by) sec.append(el("p", "body", "Kindly reply by " + fmtDate(inv.rsvp_by, { day: "numeric", month: "long" })));
    const form = el("form", "form"); form.noValidate = true;
    form.innerHTML = `
      <div><label for="gName">Your name</label><input id="gName" autocomplete="name" maxlength="120" /></div>
      <div class="choice" role="group" aria-label="Will you attend?"><button type="button" data-a="1" aria-pressed="false">Joyfully accept</button><button type="button" data-a="0" aria-pressed="false">Regretfully decline</button></div>
      <div id="peopleBox" hidden><label>How many of you, including you?</label><div class="step"><button type="button" data-d="-1" aria-label="Fewer">−</button><output id="people">1</output><button type="button" data-d="1" aria-label="More">+</button></div></div>
      <div><label for="gNote">Dietary needs or a message</label><textarea id="gNote" maxlength="600"></textarea></div>
      <button class="send" type="submit">Send reply</button>
      <div class="err" id="err" role="alert"></div>`;
    let attending = null, people = 1;
    form.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      attending = b.dataset.a === "1";
      form.querySelectorAll("[data-a]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      form.querySelector("#peopleBox").hidden = !attending;
    });
    form.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { people = Math.min(20, Math.max(1, people + Number(b.dataset.d))); form.querySelector("#people").textContent = people; });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const err = form.querySelector("#err"); err.textContent = "";
      const name = form.querySelector("#gName").value.trim();
      if (!name) return void (err.textContent = "Please add your name.");
      if (attending === null) return void (err.textContent = "Please choose accept or decline.");
      const done = () => {
        const t = el("div", "thanks");
        t.append(el("h3", null, attending ? `See you there, ${name.split(" ")[0]}!` : `Thank you, ${name.split(" ")[0]}`),
                 el("p", null, (attending ? "Your reply has been sent." : "We'll miss you. Your reply has been sent.") + (inv.preview || embed ? " (Preview: not saved.)" : "")));
        form.replaceWith(t);
      };
      if (inv.preview || embed) return done();
      const btn = form.querySelector(".send"); btn.disabled = true;
      try {
        const r = await fetch(`/api/i/${encodeURIComponent(slug)}/rsvp`, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, attending, guests: people, note: form.querySelector("#gNote").value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail[0].msg.replace(/^Value error, /, "") : d.detail);
        done();
      } catch (ex) { err.textContent = ex.message || "Couldn't send your reply. Please try again."; btn.disabled = false; }
    };
    sec.append(form);
    return sec;
  }

  // ── Scroll: progress line, hero drifts away, RSVP pill after the hero ──
  function onScroll() {
    const max = document.documentElement.scrollHeight - innerHeight;
    $("progress").style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
    const h = $("hero").offsetHeight, k = Math.min(1, scrollY / h);
    $("heroIn").style.transform = `translateY(${scrollY * 0.35}px)`;
    $("heroIn").style.opacity = String(1 - k * 1.2);
    document.querySelectorAll(".leaves svg").forEach((s, i) => { s.style.translate = `0 ${scrollY * (i ? -0.15 : 0.2)}px`; });
    const rsvp = $("rsvp");
    const nearRsvp = rsvp && rsvp.getBoundingClientRect().top < innerHeight;
    $("pill").classList.toggle("show", scrollY > h * 0.6 && !nearRsvp);
  }
  addEventListener("scroll", onScroll, { passive: true });

  if (embed) {
    // The editor sends the couple's unsaved invitation as they type.
    addEventListener("message", (e) => {
      if (e.origin !== location.origin || !e.data || e.data.type !== "confetti-preview") return;
      render(e.data.inv); onScroll();
    });
    parent.postMessage({ type: "confetti-preview-ready" }, location.origin);
  } else {
    fetch(`/api/i/${encodeURIComponent(slug)}`).then((r) => r.ok ? r.json() : Promise.reject()).then((data) => {
      render(data); onScroll();
      if (data.preview) { $("previewBar").hidden = false; $("previewLink").href = `/e/${slug}/invite`; }
    }).catch(() => { document.querySelectorAll("header, main, footer, .pill").forEach((n) => n.hidden = true); $("missing").hidden = false; });
  }
})();
</script>
</body>
</html>
