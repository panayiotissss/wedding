<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · Confetti</title>
  <meta name="theme-color" content="#FBF7F2" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .header-actions { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
    @media (max-width: 520px) { .hide-sm { display: none; } }

    /* Login */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 70px); padding: 2rem 1rem; }
    #loginScreen .card { width: 100%; max-width: 400px; }
    .login-error { margin-top: .9rem; padding: .7rem 1rem; border-radius: 12px; background: var(--err-soft); color: var(--err); font-size: .9rem; text-align: center; display: none; }

    /* Gallery */
    #galleryScreen { display: none; max-width: 1180px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
    .gal-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: .75rem; margin: .5rem 0 1.25rem; }
    .gal-head h1 { font-family: var(--serif); font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 600; line-height: 1.05; }
    .count { color: var(--muted); font-size: .95rem; margin-top: .25rem; }
    .gal-tools { display: flex; gap: .5rem; flex-wrap: wrap; }
    .brand-full span { white-space: normal; overflow: visible; line-height: 1.1; }
    @media (max-width: 520px) { .brand-full { font-size: 1.2rem; } }

    /* Selecting: tap a photo's circle to pick it; once anything is picked,
       tapping a photo toggles it too. "Delete all" becomes "Delete N selected". */
    .sel {
      position: absolute; top: 6px; left: 6px; z-index: 2; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid #fff; background: rgba(43,36,32,.28); box-shadow: 0 1px 4px rgba(0,0,0,.25);
      color: #fff; font-size: .75rem; font-weight: 700; display: grid; place-items: center; cursor: pointer;
      padding: 0; opacity: 0; transition: opacity .15s, background .15s;
    }
    .photo-thumb:hover .sel, .photo-thumb:focus-within .sel, body.selecting .sel { opacity: 1; }
    @media (hover: none) { .sel { opacity: .9; } }
    .photo-thumb.selected .sel { background: var(--accent); opacity: 1; }
    .photo-thumb.selected .sel::before { content: "✓"; }
    .photo-thumb.selected img, .photo-thumb.selected video { transform: scale(.9); border-radius: 8px; }
    .photo-thumb.selected:hover img, .photo-thumb.selected:hover video { transform: scale(.9); }
    .sel-all { margin-left: auto; background: none; border: 0; color: var(--accent); font-weight: 600; font-size: .85rem; cursor: pointer; padding: .25rem 0; }
    #clearSel { display: none; }
    body.selecting #clearSel { display: inline-flex; }

    .share-panel {
      display: flex; align-items: center; gap: 1.1rem; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: 1.5rem; box-shadow: var(--shadow);
    }
    .share-body { flex: 1; min-width: 0; }
    .share-title { font-weight: 600; margin-bottom: .15rem; }
    .share-sub { font-size: .85rem; color: var(--muted); margin-bottom: .6rem; }
    .share-link code {
      display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .7rem;
      font-size: .8rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .share-actions { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
    .share-qr { width: 104px; height: 104px; border-radius: 12px; border: 1px solid var(--line); flex-shrink: 0; background: #fff; }
    @media (max-width: 520px) { .share-qr { width: 84px; height: 84px; } }

    .chips { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .4rem; margin-bottom: 1.25rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: .45rem .85rem; border-radius: 999px; font-size: .85rem; text-decoration: none;
      background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); text-transform: capitalize;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip b { color: var(--muted); font-weight: 500; margin-left: .25rem; }

    .guest-section { margin-bottom: 2.25rem; scroll-margin-top: 80px; }
    .guest-header { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .75rem; }
    .guest-name { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; text-transform: capitalize; }
    .guest-count { font-size: .82rem; color: var(--muted); }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    @media (max-width: 520px) { .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 3px; } }
    .photo-thumb { aspect-ratio: 1; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg-deep); position: relative; }
    @media (max-width: 520px) { .photo-thumb { border-radius: 4px; } }
    .photo-thumb img, .photo-thumb video { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
    .photo-thumb:hover img, .photo-thumb:hover video { transform: scale(1.04); }
    .video-badge {
      position: absolute; top: 6px; right: 6px; background: rgba(43,36,32,.65); color: #fff;
      font-size: .65rem; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    }

    .state-msg { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .state-msg .icon { font-size: 2.4rem; display: block; margin-bottom: .6rem; }

    /* Lightbox */
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(20,16,14,.95); z-index: 100; align-items: center; justify-content: center; flex-direction: column; padding: 1rem; }
    #lightbox.open { display: flex; }
    #lightbox img, #lightbox video { max-width: 94vw; max-height: 74vh; border-radius: 6px; object-fit: contain; }
    #lightbox video { background: #000; }
    .lb-controls { display: flex; gap: 1rem; margin-top: 1rem; align-items: center; }
    .lb-btn {
      background: rgba(255,255,255,.14); border: none; color: #fff; border-radius: 999px; padding: .55rem 1.05rem;
      cursor: pointer; font-size: .9rem; text-decoration: none; transition: background .15s;
    }
    .lb-btn:hover { background: rgba(255,255,255,.28); }
    .lb-btn:disabled { opacity: .3; cursor: not-allowed; }
    .lb-counter { color: rgba(255,255,255,.65); font-size: .85rem; min-width: 70px; text-align: center; }
    .lb-close { position: absolute; top: .75rem; right: .75rem; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.12); border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    .lb-caption { color: rgba(255,255,255,.6); font-size: .8rem; margin-top: .6rem; text-transform: capitalize; text-align: center; }
    .lb-bottom { display: flex; gap: .6rem; margin-top: 1rem; }
    .lb-delete { background: rgba(163,58,47,.85); }
    .lb-delete:hover:not(:disabled) { background: rgba(163,58,47,1); }
  </style>
</head>
<body>

<header class="topbar sticky">
  <a href="#" class="brand brand-full" id="brandLink" title="Back to top"><img src="/static/favicon.svg" alt="" /><span id="brand">Gallery</span></a>
  <div class="header-actions" id="headerActions" style="display:none">
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
  </div>
</header>

<!-- Login form -->
<div id="loginScreen">
  <div class="card">
    <h1 class="page-title">Your gallery</h1>
    <p class="page-sub">Enter your gallery password to see your photos.</p>
    <label class="label" for="passwordInput">Password</label>
    <input class="input" type="password" id="passwordInput" placeholder="Gallery password" autocomplete="current-password" style="margin-bottom:1rem" />
    <button class="btn btn-lg btn-block" id="loginBtn">Enter gallery</button>
    <div class="login-error" id="loginError">Wrong password. Try again.</div>
    <p class="foot-note">Forgot which gallery? <a href="/login">Log in with your email</a></p>
  </div>
</div>

<!-- Gallery (shown after login) -->
<div id="galleryScreen">
  <div class="gal-head">
    <div>
      <h1 id="galTitle">Your photos</h1>
      <div class="count" id="statsLabel">Loading…</div>
    </div>
    <div class="gal-tools">
      <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Reload photos">↻ Refresh</button>
      <button class="btn btn-sm" id="downloadBtn">Download all</button>
      <button class="btn btn-danger btn-sm" id="deleteAllBtn" title="Delete every photo">Delete all</button>
      <button class="btn btn-ghost btn-sm" id="clearSel" title="Clear selection">Clear selection</button>
    </div>
  </div>

  <div class="share-panel">
    <div class="share-body">
      <div class="share-title">Invite guests to upload</div>
      <div class="share-sub">Print the QR code or send them the link.</div>
      <div class="share-link"><code id="guestLink"></code></div>
      <div class="share-actions">
        <button class="btn btn-soft btn-sm" id="copyLink" type="button">Copy link</button>
        <a class="btn btn-ghost btn-sm" id="downloadQr" download="wedding_qr.png">⬇ QR code</a>
      </div>
    </div>
    <img class="share-qr" id="galleryQr" alt="Guest upload QR code" />
  </div>

  <div id="galleryContent">
    <div class="state-msg"><div class="spinner"></div>Loading photos…</div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">&#x2715;</button>

  <div id="lbMedia"></div>
  <p class="lb-caption" id="lbCaption"></p>

  <div class="lb-controls">
    <button class="lb-btn" id="lbPrev">&#8592; Prev</button>
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-btn" id="lbNext">Next &#8594;</button>
  </div>

  <div class="lb-bottom">
    <a class="lb-btn" id="lbDownload" download>⬇ Save</a>
    <button class="lb-btn lb-delete" id="lbDelete">Delete</button>
  </div>
</div>

<script>
  "use strict";

  // ── Multi-tenant: derive this event's slug from the URL (/e/<slug>/gallery)
  const SLUG = location.pathname.split("/")[2] || "";
  const API  = `/api/e/${SLUG}`;

  // ── State ──────────────────────────────────────────────────────────────

  let allPhotos = [];   // flat list: { url, key, filename, guest }
  const selected = new Set();   // keys of photos picked for deletion
  let lbIndex   = 0;

  // Pull the couple's names for the header/title (WED-4 dynamic name)
  (async () => {
    try {
      const info = await (await fetch(`${API}/info`)).json();
      if (info && info.names) {
        document.getElementById("brand").textContent = info.names;
        document.getElementById("galTitle").textContent = info.names;
        document.title = `Gallery · ${info.names}`;
      }
    } catch { /* keep default header */ }
  })();

  // ── Share-with-guests panel: the QR + guest link, always retrievable here ──
  (function setupSharePanel() {
    const guestUrl = `${location.origin}/e/${SLUG}`;
    document.getElementById("guestLink").textContent = guestUrl;
    document.getElementById("galleryQr").src = `/e/${SLUG}/qr.png`;
    document.getElementById("downloadQr").href = `/e/${SLUG}/qr.png`;

    document.getElementById("copyLink").addEventListener("click", async () => {
      const btn = document.getElementById("copyLink");
      try {
        await navigator.clipboard.writeText(guestUrl);
        btn.textContent = "Copied!";
      } catch {
        btn.textContent = "Copy failed";
      }
      setTimeout(() => { btn.textContent = "Copy link"; }, 1500);
    });
  })();

  // The names in the header scroll back to the top instead of leaving the gallery.
  document.getElementById("brandLink").addEventListener("click", e => {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ── DOM refs ───────────────────────────────────────────────────────────

  const loginScreen   = document.getElementById("loginScreen");
  const galleryScreen = document.getElementById("galleryScreen");
  const headerActions = document.getElementById("headerActions");
  const passwordInput = document.getElementById("passwordInput");
  const loginBtn      = document.getElementById("loginBtn");
  const loginError    = document.getElementById("loginError");
  const galleryContent= document.getElementById("galleryContent");
  const statsLabel    = document.getElementById("statsLabel");
  const deleteAllBtn  = document.getElementById("deleteAllBtn");
  const refreshBtn    = document.getElementById("refreshBtn");
  const downloadBtn   = document.getElementById("downloadBtn");
  const logoutBtn     = document.getElementById("logoutBtn");
  const lightbox      = document.getElementById("lightbox");
  const lbMedia       = document.getElementById("lbMedia");
  const lbClose       = document.getElementById("lbClose");
  const lbPrev        = document.getElementById("lbPrev");
  const lbNext        = document.getElementById("lbNext");
  const lbCounter     = document.getElementById("lbCounter");
  const lbCaption     = document.getElementById("lbCaption");
  const lbDownload    = document.getElementById("lbDownload");
  const lbDelete      = document.getElementById("lbDelete");

  // ── Boot: check session ────────────────────────────────────────────────
  // On page load we ask /api/me: if authenticated we go straight to the gallery,
  // no password re-entry needed (session cookie is present).

  (async () => {
    try {
      const res = await fetch(`${API}/me`);
      const { authenticated } = await res.json();
      if (authenticated) {
        showGallery();
        loadPhotos();
      }
    } catch { /* network error: stay on login screen */ }
  })();

  // ── Login ──────────────────────────────────────────────────────────────

  loginBtn.addEventListener("click", doLogin);
  passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

  async function doLogin() {
    const pw = passwordInput.value;
    if (!pw) return;

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking…";
    loginError.style.display = "none";

    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw }),
      });

      if (res.ok) {
        passwordInput.value = "";
        showGallery();
        loadPhotos();
      } else {
        loginError.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.textContent = "Enter gallery";
        passwordInput.focus();
      }
    } catch {
      loginError.textContent = "Network error. Please try again.";
      loginError.style.display = "block";
      loginBtn.disabled = false;
      loginBtn.textContent = "Enter gallery";
    }
  }

  function showGallery() {
    loginScreen.style.display   = "none";
    galleryScreen.style.display = "block";
    headerActions.style.display = "flex";
  }

  // ── Logout ─────────────────────────────────────────────────────────────

  logoutBtn.addEventListener("click", async () => {
    await fetch(`${API}/logout`, { method: "POST" });
    galleryScreen.style.display = "none";
    headerActions.style.display = "none";
    loginScreen.style.display   = "flex";
    loginBtn.disabled = false;
    loginBtn.textContent = "Enter gallery";
    galleryContent.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading photos…</div>';
    allPhotos = [];
  });

  // ── Load photos ─────────────────────────────────────────────────────────

  refreshBtn.addEventListener("click", loadPhotos);

  async function loadPhotos() {
    galleryContent.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading photos…</div>';
    statsLabel.textContent = "Loading…";
    allPhotos = [];

    try {
      const res = await fetch(`${API}/photos`);
      if (res.status === 401) {
        // Session expired
        galleryScreen.style.display = "none";
        headerActions.style.display = "none";
        loginScreen.style.display   = "flex";
        return;
      }
      const groups = await res.json(); // [{guest, photos:[{url,key,filename,uploaded_at}]}]

      allPhotos = [];
      groups.forEach(g => g.photos.forEach(p => allPhotos.push({ ...p, guest: g.guest })));

      renderGallery(groups);

      const total = allPhotos.length;
      statsLabel.textContent = `${total} photo${total === 1 ? "" : "s"} from ${groups.length} guest${groups.length === 1 ? "" : "s"}`;
    } catch (err) {
      galleryContent.innerHTML = `<div class="state-msg"><span class="icon">⚠️</span>Failed to load photos. <a href="#" onclick="loadPhotos(); return false">Retry</a></div>`;
      console.error(err);
    }
  }

  function renderGallery(groups) {
    if (!groups.length) {
      galleryContent.innerHTML = '<div class="state-msg"><span class="icon">📷</span><b>No photos yet.</b><br>Share the QR code above and they will appear here as guests upload.</div>';
      return;
    }

    galleryContent.innerHTML = "";
    selected.clear();
    document.body.classList.remove("selecting");
    updateSelectionUI();

    // Jump-to-guest chips once there's more than one guest.
    if (groups.length > 1) {
      const chips = document.createElement("nav");
      chips.className = "chips";
      groups.forEach(({ guest, photos }, gi) => {
        const a = document.createElement("a");
        a.className = "chip";
        a.href = `#guest-${gi}`;
        a.innerHTML = `${escHtml(guest.replace(/_/g, " "))}<b>${photos.length}</b>`;
        chips.appendChild(a);
      });
      galleryContent.appendChild(chips);
    }

    groups.forEach(({ guest, photos }, gi) => {
      const section = document.createElement("div");
      section.className = "guest-section";
      section.id = `guest-${gi}`;

      const hdr = document.createElement("div");
      hdr.className = "guest-header";
      hdr.innerHTML = `
        <span class="guest-name">${escHtml(guest.replace(/_/g, " "))}</span>
        <span class="guest-count">${photos.length} photo${photos.length === 1 ? "" : "s"}</span>
        <button class="sel-all" type="button">Select all</button>
      `;
      const guestKeys = photos.map(p => p.key);
      const selAll = hdr.querySelector(".sel-all");
      selAll.dataset.keys = JSON.stringify(guestKeys);
      selAll.addEventListener("click", () => {
        const all = guestKeys.every(k => selected.has(k));
        guestKeys.forEach(k => all ? selected.delete(k) : selected.add(k));
        syncThumbs();
      });
      section.appendChild(hdr);

      const grid = document.createElement("div");
      grid.className = "photo-grid";

      photos.forEach(photo => {
        const globalIdx = allPhotos.findIndex(p => p.key === photo.key);
        const thumb = document.createElement("div");
        thumb.className = "photo-thumb";
        thumb.setAttribute("role", "button");
        thumb.setAttribute("tabindex", "0");
        thumb.setAttribute("aria-label", `Open ${photo.filename}`);

        if (isVideo(photo.filename)) {
          const vid = document.createElement("video");
          vid.src = photo.url;
          vid.muted = true;
          vid.playsInline = true;
          vid.preload = "metadata"; // just enough to show first frame
          thumb.appendChild(vid);

          const badge = document.createElement("span");
          badge.className = "video-badge";
          badge.textContent = "▶ Video";
          thumb.appendChild(badge);
        } else {
          const img = new Image();
          img.src = photo.url;
          img.alt = photo.filename;
          img.loading = "lazy";
          thumb.appendChild(img);
        }

        thumb.dataset.key = photo.key;
        const sel = document.createElement("button");
        sel.className = "sel";
        sel.type = "button";
        sel.setAttribute("aria-label", "Select photo");
        sel.addEventListener("click", e => { e.stopPropagation(); toggleSelect(photo.key); });
        thumb.appendChild(sel);
        thumb.addEventListener("click",  () => onThumb(thumb, globalIdx));
        thumb.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") onThumb(thumb, globalIdx); });
        grid.appendChild(thumb);
      });

      section.appendChild(grid);
      galleryContent.appendChild(section);
    });
  }

  // ── Download zip ────────────────────────────────────────────────────────

  downloadBtn.addEventListener("click", () => {
    // The server makes sure the zip exists in R2, then redirects to a
    // presigned R2 link, so the bytes come straight from R2 (WED-9).
    // Using an anchor click keeps the browser's native download UI.
    const a = document.createElement("a");
    a.href = `${API}/download-zip`;
    a.download = "wedding_photos.zip";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    downloadBtn.textContent = "Preparing…";
    // Reset after a few seconds (the download will start in background)
    setTimeout(() => { downloadBtn.textContent = "Download all"; }, 5000);
  });

  // ── Selecting photos (no mode: the circles are always there) ────────────

  function onThumb(thumb, idx) {
    // While something is picked, tapping photos keeps picking; otherwise open it.
    if (selected.size) return toggleSelect(thumb.dataset.key);
    openLightbox(idx);
  }

  function toggleSelect(key) {
    if (selected.has(key)) selected.delete(key); else selected.add(key);
    syncThumbs();
  }

  function clearSelection() {
    selected.clear();
    syncThumbs();
  }

  // Reflect `selected` on the thumbnails, per-guest buttons and toolbar.
  function syncThumbs() {
    document.querySelectorAll(".photo-thumb").forEach(t =>
      t.classList.toggle("selected", selected.has(t.dataset.key)));
    document.querySelectorAll(".sel-all").forEach(b => {
      const keys = JSON.parse(b.dataset.keys || "[]");
      b.textContent = keys.length && keys.every(k => selected.has(k)) ? "Deselect all" : "Select all";
    });
    document.body.classList.toggle("selecting", selected.size > 0);
    updateSelectionUI();
  }

  function updateSelectionUI() {
    deleteAllBtn.textContent = selected.size ? `Delete ${selected.size} selected` : "Delete all";
    deleteAllBtn.title = selected.size ? "Delete the selected photos" : "Delete every photo";
  }

  document.getElementById("clearSel").addEventListener("click", clearSelection);

  async function deleteSelected() {
    const keys = [...selected];
    const n = keys.length;
    if (!confirm(`Delete ${n} selected photo${n === 1 ? "" : "s"}?\n\nThis permanently removes ${n === 1 ? "it" : "them"} and cannot be undone.`)) return;

    deleteAllBtn.disabled = true;
    deleteAllBtn.textContent = "Deleting…";
    let failed = 0;
    for (const key of keys) {
      try {
        const res = await fetch(`${API}/delete`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key }),
        });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        allPhotos = allPhotos.filter(p => p.key !== key);
      } catch (err) {
        failed++;
        console.error(err);
      }
    }
    deleteAllBtn.disabled = false;
    selected.clear();
    document.body.classList.remove("selecting");
    updateSelectionUI();
    if (allPhotos.length) rebuildGalleryFromState();
    else { renderGallery([]); statsLabel.textContent = "0 photos"; }
    if (failed) alert(`${failed} photo${failed === 1 ? "" : "s"} could not be deleted. Please try again.`);
  }

  // ── Delete all photos ───────────────────────────────────────────────────
  // Double-confirmed because it can't be undone.

  deleteAllBtn.addEventListener("click", async () => {
    if (selected.size) return deleteSelected();
    const total = allPhotos.length;
    if (total === 0) { alert("There are no photos to delete."); return; }
    if (!confirm(`Delete ALL ${total} photo${total === 1 ? "" : "s"}?\n\nThis permanently removes every photo and video in the gallery and cannot be undone.`)) return;
    if (!confirm("Are you absolutely sure? This is your last chance to cancel.")) return;

    deleteAllBtn.disabled = true;
    deleteAllBtn.textContent = "Deleting…";
    try {
      const res = await fetch(`${API}/delete-all`, { method: "POST" });
      if (res.status === 401) {
        galleryScreen.style.display = "none";
        headerActions.style.display = "none";
        loginScreen.style.display   = "flex";
        return;
      }
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json().catch(() => ({}));
      allPhotos = [];
      closeLightbox();
      renderGallery([]);
      statsLabel.textContent = "0 photos";
      const n = data.deleted ?? total;
      alert(`Deleted ${n} item${n === 1 ? "" : "s"}. The gallery is now empty.`);
    } catch (err) {
      alert("Could not delete all photos. Please try again.");
      console.error(err);
    } finally {
      deleteAllBtn.disabled = false;
      updateSelectionUI();
    }
  });

  // ── Lightbox ────────────────────────────────────────────────────────────

  function openLightbox(index) {
    lbIndex = index;
    renderLbMedia();
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    // Pause any playing video
    const vid = lbMedia.querySelector("video");
    if (vid) vid.pause();
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
  }

  function renderLbMedia() {
    lbMedia.innerHTML = "";
    const photo = allPhotos[lbIndex];

    if (isVideo(photo.filename)) {
      const vid = document.createElement("video");
      vid.src = photo.url;
      vid.controls = true;
      vid.playsInline = true;
      vid.autoplay = true;
      vid.muted = false;
      lbMedia.appendChild(vid);
    } else {
      const img = new Image();
      img.src = photo.url;
      img.alt = photo.filename;
      lbMedia.appendChild(img);
    }

    lbCounter.textContent = `${lbIndex + 1} / ${allPhotos.length}`;
    lbCaption.textContent = `${photo.guest.replace(/_/g, " ")} · ${photo.filename}`;
    lbDownload.href = photo.download_url || photo.url;
    lbDownload.download = photo.filename;

    lbPrev.disabled = lbIndex === 0;
    lbNext.disabled = lbIndex === allPhotos.length - 1;
  }

  lbClose.addEventListener("click", closeLightbox);
  lbPrev.addEventListener("click",  () => { if (lbIndex > 0) { lbIndex--; renderLbMedia(); } });
  lbNext.addEventListener("click",  () => { if (lbIndex < allPhotos.length - 1) { lbIndex++; renderLbMedia(); } });
  lbDelete.addEventListener("click", deleteCurrent);

  // ── Delete (couple only: this whole page is behind login) ────────────────

  async function deleteCurrent() {
    const photo = allPhotos[lbIndex];
    if (!photo) return;

    const who = photo.guest.replace(/_/g, " ");
    if (!confirm(`Delete this photo from ${who}?\n\nThis permanently removes it and cannot be undone.`)) return;

    lbDelete.disabled = true;
    lbDelete.textContent = "Deleting…";

    try {
      const res = await fetch(`${API}/delete`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: photo.key }),
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);

      // Drop it from local state, then refresh the grid + stats without a reload.
      allPhotos.splice(lbIndex, 1);

      if (allPhotos.length === 0) {
        closeLightbox();
        renderGallery([]);
        statsLabel.textContent = "0 photos";
      } else {
        if (lbIndex >= allPhotos.length) lbIndex = allPhotos.length - 1;
        renderLbMedia();
        rebuildGalleryFromState();
      }
    } catch (err) {
      alert("Could not delete the photo. Please try again.");
      console.error(err);
    } finally {
      lbDelete.disabled = false;
      lbDelete.textContent = "Delete";
    }
  }

  // Rebuild the guest sections from the in-memory photo list (post-delete),
  // so we don't have to round-trip to the server just to redraw.
  function rebuildGalleryFromState() {
    const byGuest = {};
    allPhotos.forEach(p => { (byGuest[p.guest] = byGuest[p.guest] || []).push(p); });
    const groups = Object.keys(byGuest).map(guest => ({ guest, photos: byGuest[guest] }));
    renderGallery(groups);
    const total = allPhotos.length;
    statsLabel.textContent =
      `${total} photo${total === 1 ? "" : "s"} from ${groups.length} guest${groups.length === 1 ? "" : "s"}`;
  }

  // Click outside media to close
  lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

  // Keyboard navigation
  document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape")       closeLightbox();
    if (e.key === "ArrowLeft"  && lbIndex > 0)                     { lbIndex--; renderLbMedia(); }
    if (e.key === "ArrowRight" && lbIndex < allPhotos.length - 1)  { lbIndex++; renderLbMedia(); }
  });

  // ── Helpers ─────────────────────────────────────────────────────────────

  function isVideo(filename) {
    return /\.(mp4|mov|avi|webm|mkv)$/i.test(filename);
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
</script>
</body>
</html>
